<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O/I Spark — 신규 과제 발굴 (트렌드룸 개선)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 디자인 시스템 토큰 (유지) ===== */
:root{
  --tmb1:#eaf3fd; --tmb2:#cbe3fa; --tmb3:#a2cef4; --tmb4:#74b4ee; --tmb5:#4fa3e8;
  --tmt1:#e7f5f2; --tmt2:#c6e9e2; --tmt3:#9bd7cc; --tmt4:#6ac1b2; --tmt5:#40ac99;
  --tmp1:#f6eaf2; --tmp2:#e9cfe0; --tmp3:#d3a7c4; --tmp4:#bb84ac; --tmp5:#a06b98;
  --bg:#e9f0f6; --panel:#fff; --panel-sub:#f8fafc;
  --brand:#336591; --brand-hover:#284f73; --brand-soft:#e4eef7; --brand-tint:#eff6fb;
  --ink:#101c21; --t1:#3c4149; --t2:#4b5160; --t3:#6b7280; --t4:#9096a2; --t5:#b4b9c3;
  --line:#e8eaed; --line-soft:#f0f1f3; --line-faint:#f4f5f7; --line-mid:#e2e5e9;
  --fill:#f4f5f7; --fill2:#f2f4f7;
  --ok:#16a34a; --ok-bg:#eaf7ee;
  --warn:#d97706; --warn-bg:#fdf4e7;
  --bad:#dc2626; --bad-bg:#fdeceb;
  --c1:#3D7EAE; --c2:#a7c4d8; --c3:#d5e5f0;
  --edit:#2563eb;
  --bar:#2196F3;
  color-scheme:light;
}
/* ===== 다크 테마 (랜딩 페이지 색상표 기반: 딥 네이비/퍼플 + 퍼플·블루 액센트) ===== */
html[data-theme="dark"]{
  --tmb1:#15243f; --tmb2:#1b3763; --tmb3:#224d8a; --tmb4:#2c64b0; --tmb5:#3a7ad2;
  --tmt1:#13251f; --tmt2:#163f37; --tmt3:#1a574c; --tmt4:#206f61; --tmt5:#26907a;
  --tmp1:#201a34; --tmp2:#302453; --tmp3:#453672; --tmp4:#614a8e; --tmp5:#8b639b;
  --bg:#0a0912; --panel:#14121f; --panel-sub:#1a1730;
  --brand:#a855f7; --brand-hover:#9333ea; --brand-soft:#241a3f; --brand-tint:#1d1733;
  --ink:#edeaf7; --t1:#d6d2e8; --t2:#b3aecf; --t3:#8f8ab0; --t4:#6f6a8e; --t5:#544f6e;
  --line:#332f49; --line-soft:#2a2640; --line-faint:#231f30; --line-mid:#3f3958;
  --fill:#211d38; --fill2:#1a1730;
  --ok:#34d399; --ok-bg:#12281f;
  --warn:#fbbf24; --warn-bg:#2a2113;
  --bad:#f87171; --bad-bg:#2a1618;
  --c1:#a855f7; --c2:#7c6ba8; --c3:#463f63;
  --edit:#60a5fa;
  --bar:#8B639B;
  color-scheme:dark;
}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#2f2a42}
html[data-theme="dark"] .ctip,html[data-theme="dark"] .ptip{background:#241f38;box-shadow:0 2px 12px rgba(0,0,0,.5)}
html{transition:background-color .22s ease}
body{transition:background-color .22s ease,color .22s ease}
*{box-sizing:border-box;margin:0;padding:0}
/* ── 본문 한글 폰트: paybooc (4 weight) ── */
@font-face{font-family:'paybooc';src:url('/fonts/paybooc-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'paybooc';src:url('/fonts/paybooc-Medium.woff2') format('woff2');font-weight:400 500;font-style:normal;font-display:swap}
@font-face{font-family:'paybooc';src:url('/fonts/paybooc-Bold.woff2') format('woff2');font-weight:600 700;font-style:normal;font-display:swap}
@font-face{font-family:'paybooc';src:url('/fonts/paybooc-ExtraBold.woff2') format('woff2');font-weight:800 900;font-style:normal;font-display:swap}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);
  font-family:'paybooc',"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;min-width:1160px}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#dcdfe4;border-radius:8px;border:3px solid transparent;background-clip:content-box}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}

/* ===== 레이아웃 ===== */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px}
.brand-mk{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:-.4px}
.brand-nm{font-size:13.5px;font-weight:700;letter-spacing:-.3px}
.brand-sb{font-size:10.5px;color:var(--t4)}
.ski-logo{font-family:Arial,'Helvetica Neue',sans-serif;font-weight:800;white-space:nowrap;letter-spacing:-.3px;line-height:1;display:inline-flex;align-items:baseline;gap:5px}
.ski-logo b{color:#EA002C}
.ski-logo i{color:#FF7A00;font-weight:700;font-style:normal}
@font-face{font-family:'Chillax';src:url('/fonts/Chillax-Semibold.woff2') format('woff2'),url('/fonts/Chillax-Semibold.woff') format('woff');font-weight:600;font-style:normal;font-display:swap}
.oi-logo{font-family:'Chillax','Pretendard Variable',Arial,sans-serif;font-weight:600;letter-spacing:-.02em;white-space:nowrap;background:linear-gradient(100deg,#9a6ee0,#c9a6dd 50%,#f9efec);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="light"] .oi-logo{background:linear-gradient(100deg,#2f5d84,#3D7EAE 55%,#5fa0d0);-webkit-background-clip:text;background-clip:text}
.logout-b{color:var(--t3)}
.logout-b:hover{background:var(--fill);color:var(--bad)}
.logout-b:hover .nav-i{border-color:var(--bad);color:var(--bad)}
.acct{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.acct-u{display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11.5px;color:var(--t2);min-width:0}
.acct-av{width:20px;height:20px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.acct-em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.acct-row{display:flex;gap:6px;padding:0 10px}
.acct-b{flex:1;font-size:11px;font-weight:600;padding:6px 8px;border:1px solid var(--line-mid);border-radius:7px;background:var(--panel);color:var(--t2);cursor:pointer}
.acct-b:hover{background:var(--fill);color:var(--ink)}
.acct-b.danger:hover{border-color:var(--bad);color:var(--bad)}
.pw-ov{position:fixed;inset:0;z-index:200;background:rgba(4,4,10,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:24px}
.pw-modal{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px}
.pw-modal h3{font-size:16px;font-weight:700;margin-bottom:4px}
.pw-l{font-size:11.5px;font-weight:600;color:var(--t3);margin-top:4px}
.pw-i{height:38px;padding:0 11px;border:1px solid var(--line-mid);border-radius:8px;background:var(--panel-sub);color:var(--ink);font-size:13px}
.pw-i:focus{outline:none;border-color:var(--brand)}
.pw-err{color:var(--bad);font-size:11.5px;min-height:14px}
.pw-actions{display:flex;gap:8px;margin-top:8px}
.pw-actions .btn{flex:1;justify-content:center}
.nav{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:18px}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-g:not(:first-child){border-top:1px solid var(--line);padding-top:18px}
.nav-t{font-size:10.5px;font-weight:600;color:var(--t4);letter-spacing:.4px;padding:0 10px 7px}
.nav-b{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;background:transparent;
  border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:var(--t1);font-weight:500}
.nav-b:hover{background:var(--line-faint)}
.nav-b.on{background:var(--brand-soft);font-weight:600;color:var(--ink)}
.nav-i{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--t5);border:1.5px solid var(--t5);border-radius:4px}
.nav-b.on .nav-i{border-color:var(--brand);color:var(--brand)}
.nav-c{margin-left:auto;font-size:10px;font-weight:600;color:var(--brand);background:var(--brand-soft);
  border-radius:5px;padding:2px 6px}
.pipe{margin-top:auto;padding:13px;background:var(--panel-sub);border:1px solid var(--line-soft);
  border-radius:11px;display:flex;flex-direction:column;gap:9px}
.pipe-h{display:flex;align-items:center;justify-content:space-between}
.pipe-r{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t3)}
.dot{width:5px;height:5px;border-radius:50%;flex:none}

.body{flex:1;min-width:0;display:flex;flex-direction:column}
.main{padding:26px 26px 48px;display:flex;flex-direction:column;gap:18px}
/* ===== 상단 네비게이션(토바) + 계정 드롭다운 ===== */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 22px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.tb-theme{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-mid);border-radius:9px;background:var(--panel-sub);color:var(--t1);cursor:pointer;font-size:15px;line-height:1}
.tb-theme:hover{border-color:var(--brand);color:var(--brand)}
.tb-acct{position:relative;margin-left:2px}
.tb-trigger{display:flex;align-items:center;gap:9px;padding:5px 8px 5px 5px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:none}
.tb-trigger:hover{background:var(--fill);border-color:var(--line-mid)}
.tb-av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.tb-meta{display:flex;flex-direction:column;line-height:1.25;text-align:left;min-width:0}
.tb-name{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.tb-role{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.tb-caret{color:var(--t4);font-size:10px;margin-left:2px;flex:none}
.tb-menu{position:absolute;top:calc(100% + 7px);right:0;min-width:172px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -16px rgba(0,0,0,.35);padding:6px;display:none;flex-direction:column;gap:2px;z-index:50}
.tb-menu.open{display:flex}
.tb-mi{display:flex;align-items:center;gap:10px;padding:9px 11px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--t1);text-align:left;width:100%}
.tb-mi:hover{background:var(--fill)}
.tb-mi.danger{color:var(--bad)}
.tb-mi .ic{width:16px;text-align:center;color:var(--t3);flex:none}
.tb-mi.danger .ic{color:var(--bad)}
/* ===== 마이페이지 ===== */
.my-acct{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.my-av{width:52px;height:52px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.my-em{font-size:15px;font-weight:700;color:var(--ink)}
.my-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.mylist{display:flex;flex-direction:column;gap:8px}
.mycard{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.mycard:hover{border-color:var(--brand);background:var(--fill)}
.myc-t{font-size:13px;font-weight:700;color:var(--ink)}
.myc-m{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.myc-fb{font-size:11.5px;color:var(--t2);font-weight:600}
.myc-star{color:#e0a022;letter-spacing:1px}
.my-empty{padding:18px;text-align:center;color:var(--t4);font-size:12.5px}
.tr-pager{display:flex;align-items:center;justify-content:center;gap:16px;padding:15px 17px;border-top:1px solid var(--line-soft)}
/* ===== 애니메이션 테마 스위치 (해/달) ===== */
.theme-switch{
  --toggle-size:10px;
  --container-width:5.625em;--container-height:2.5em;--container-radius:6.25em;
  --container-light-bg:#3D7EAE;--container-night-bg:#1D1F2C;
  --circle-container-diameter:3.375em;--sun-moon-diameter:2.125em;
  --sun-bg:#ECCA2F;--moon-bg:#C4C9D1;--spot-color:#959DB1;
  --circle-container-offset:calc((var(--circle-container-diameter) - var(--container-height)) / 2 * -1);
  --stars-color:#fff;--clouds-color:#F3FDFF;--back-clouds-color:#AACADF;
  --transition:.5s cubic-bezier(0, -0.02, 0.4, 1.25);
  --circle-transition:.3s cubic-bezier(0, -0.02, 0.35, 1.17);
  display:inline-flex;flex:none}
.theme-switch,.theme-switch *,.theme-switch *::before,.theme-switch *::after{box-sizing:border-box;margin:0;padding:0;font-size:var(--toggle-size)}
.theme-switch__container{width:var(--container-width);height:var(--container-height);background-color:var(--container-light-bg);border-radius:var(--container-radius);overflow:hidden;cursor:pointer;box-shadow:0em -0.062em 0.062em rgba(0,0,0,0.25),0em 0.062em 0.125em rgba(255,255,255,0.94);transition:var(--transition);position:relative}
.theme-switch__container::before{content:"";position:absolute;z-index:1;inset:0;box-shadow:0em 0.05em 0.187em rgba(0,0,0,0.25) inset,0em 0.05em 0.187em rgba(0,0,0,0.25) inset;border-radius:var(--container-radius)}
.theme-switch__checkbox{display:none}
.theme-switch__circle-container{width:var(--circle-container-diameter);height:var(--circle-container-diameter);background-color:rgba(255,255,255,0.1);position:absolute;left:var(--circle-container-offset);top:var(--circle-container-offset);border-radius:var(--container-radius);box-shadow:inset 0 0 0 3.375em rgba(255,255,255,0.1),inset 0 0 0 3.375em rgba(255,255,255,0.1),0 0 0 0.625em rgba(255,255,255,0.1),0 0 0 1.25em rgba(255,255,255,0.1);display:flex;transition:var(--circle-transition);pointer-events:none}
.theme-switch__sun-moon-container{pointer-events:auto;position:relative;z-index:2;width:var(--sun-moon-diameter);height:var(--sun-moon-diameter);margin:auto;border-radius:var(--container-radius);background-color:var(--sun-bg);box-shadow:0.062em 0.062em 0.062em 0em rgba(254,255,239,0.61) inset,0em -0.062em 0.062em 0em #a1872a inset;filter:drop-shadow(0.062em 0.125em 0.125em rgba(0,0,0,0.25)) drop-shadow(0em 0.062em 0.125em rgba(0,0,0,0.25));overflow:hidden;transition:var(--transition)}
.theme-switch__moon{transform:translateX(100%);width:100%;height:100%;background-color:var(--moon-bg);border-radius:inherit;box-shadow:0.062em 0.062em 0.062em 0em rgba(254,255,239,0.61) inset,0em -0.062em 0.062em 0em #969696 inset;transition:var(--transition);position:relative}
.theme-switch__spot{position:absolute;top:0.75em;left:0.312em;width:0.75em;height:0.75em;border-radius:var(--container-radius);background-color:var(--spot-color);box-shadow:0em 0.0312em 0.062em rgba(0,0,0,0.25) inset}
.theme-switch__spot:nth-of-type(2){width:0.375em;height:0.375em;top:0.937em;left:1.375em}
.theme-switch__spot:nth-last-of-type(3){width:0.25em;height:0.25em;top:0.312em;left:0.812em}
.theme-switch__clouds{width:1.25em;height:1.25em;background-color:var(--clouds-color);border-radius:var(--container-radius);position:absolute;bottom:-0.625em;left:0.312em;box-shadow:0.937em 0.312em var(--clouds-color),-0.312em -0.312em var(--back-clouds-color),1.437em 0.375em var(--clouds-color),0.5em -0.125em var(--back-clouds-color),2.187em 0 var(--clouds-color),1.25em -0.062em var(--back-clouds-color),2.937em 0.312em var(--clouds-color),2em -0.312em var(--back-clouds-color),3.625em -0.062em var(--clouds-color),2.625em 0em var(--back-clouds-color),4.5em -0.312em var(--clouds-color),3.375em -0.437em var(--back-clouds-color),4.625em -1.75em 0 0.437em var(--clouds-color),4em -0.625em var(--back-clouds-color),4.125em -2.125em 0 0.437em var(--back-clouds-color);transition:0.5s cubic-bezier(0, -0.02, 0.4, 1.25)}
.theme-switch__stars-container{position:absolute;color:var(--stars-color);top:-100%;left:0.312em;width:2.75em;height:auto;transition:var(--transition)}
.theme-switch__checkbox:checked + .theme-switch__container{background-color:var(--container-night-bg)}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container{left:calc(100% - var(--circle-container-offset) - var(--circle-container-diameter))}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container:hover{left:calc(100% - var(--circle-container-offset) - var(--circle-container-diameter) - 0.187em)}
.theme-switch__circle-container:hover{left:calc(var(--circle-container-offset) + 0.187em)}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__moon{transform:translate(0)}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__clouds{bottom:-4.062em}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__stars-container{top:50%;transform:translateY(-50%)}

/* ===== 공통 ===== */
h1{font-size:21px;font-weight:700;letter-spacing:-.5px}
h2{font-size:14px;font-weight:700;letter-spacing:-.3px}
.lede{font-size:12.5px;color:var(--t3);line-height:1.6}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;min-height:40px}
.page-h h1::before{content:"\00a0"}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.card-b{padding:17px}
.btn{height:34px;padding:0 13px;border:1px solid var(--line-mid);background:var(--panel);border-radius:9px;
  font-size:12.5px;font-weight:600;color:var(--t1);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-hover)}
.btn.sm{height:29px;padding:0 10px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
.sel{height:32px;padding:0 10px;border:1px solid var(--line-mid);border-radius:8px;background:var(--panel);
  font-size:12.5px;font-weight:600;color:var(--t1);cursor:pointer}
.inp{height:32px;padding:0 10px;border:1px solid var(--line-mid);border-radius:8px;background:var(--panel);
  font-size:12.5px;width:100%}
.inp:focus,.sel:focus,textarea:focus{outline:none;border-color:var(--brand)}
.tag{font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap;display:inline-block}
.tag.oc{color:var(--t2);background:var(--fill2);border:1px solid var(--line)}
.tag.lv{color:var(--brand);background:var(--brand-soft)}
.tag.ok{color:var(--ok);background:var(--ok-bg)}
.tag.wn{color:var(--warn);background:var(--warn-bg)}
.tag.bd{color:var(--bad);background:var(--bad-bg)}
.tag.nt{color:var(--t3);background:var(--fill)}
.chip{font-size:11.5px;padding:5px 11px;border:1px solid var(--line-mid);border-radius:99px;
  background:var(--panel);color:var(--t2);cursor:pointer;white-space:nowrap;font-weight:500}
.chip:hover{border-color:var(--t4);color:var(--ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.row-f{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lbl{font-size:11.5px;font-weight:600;color:var(--t3);white-space:nowrap}
.hr{height:1px;background:var(--line-soft)}
.note{font-size:11.5px;color:var(--t4);line-height:1.6}
.hint{display:flex;gap:8px;background:var(--brand-tint);border:1px solid #dbe5e9;border-radius:10px;
  padding:11px 13px;font-size:11.5px;color:var(--t1);line-height:1.6}
.hint .dot{margin-top:6px;background:var(--brand)}

/* ===== 컨트롤 바 (목록 바로 위) ===== */
.ctlbar{display:flex;align-items:center;gap:10px;padding:12px 17px;border-bottom:1px solid var(--line-soft);
  flex-wrap:wrap;background:var(--panel-sub);border-radius:14px 14px 0 0}
.ctl-sep{width:1px;height:18px;background:var(--line);margin:0 2px}

/* ===== 표 ===== */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;color:var(--t3);padding:10px 8px;
  background:var(--panel-sub);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--line-faint);font-size:12.5px;vertical-align:middle}
th:first-child,td:first-child{padding-left:17px}
th:last-child,td:last-child{padding-right:17px}
.r-hover:hover{background:var(--panel-sub)}
.tt{font-size:13px;font-weight:600;letter-spacing:-.2px;line-height:1.45}
.ts{font-size:11.5px;color:var(--t4);line-height:1.5;margin-top:3px}
.tr{text-align:right}
.dgrp td{background:var(--panel-sub);padding:8px 17px;font-size:11.5px;font-weight:700;color:var(--t2);
  border-bottom:1px solid var(--line-faint)}

/* ===== 페이지네이션 ===== */
.pager{display:flex;align-items:center;gap:10px;padding:13px 17px}
.pg{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-mid);
  border-radius:7px;font-size:11.5px;color:var(--t2);cursor:pointer;background:var(--panel);font-weight:500}
.pg:hover{background:var(--fill)}
.pg.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.pg:disabled{opacity:.4;cursor:default}

/* ===== 캘린더 ===== */
.calwrap{position:relative}
.calbtn{height:32px;padding:0 11px;border:1px solid var(--line-mid);border-radius:8px;background:var(--panel);
  font-size:12.5px;font-weight:600;color:var(--t1);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  white-space:nowrap}
.calbtn:hover{background:var(--fill)}
.calbtn.act{border-color:var(--brand);color:var(--brand)}
.cal{position:absolute;top:38px;left:0;z-index:40;width:272px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cal-m{font-size:12.5px;font-weight:700}
.cal-nav{width:24px;height:24px;border:1px solid var(--line-mid);border-radius:6px;background:var(--panel);
  cursor:pointer;font-size:11px;color:var(--t2);display:flex;align-items:center;justify-content:center}
.cal-nav:hover{background:var(--fill)}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-w{font-size:10px;color:var(--t4);text-align:center;padding:3px 0;font-weight:600}
.cal-d{height:32px;border:0;background:transparent;border-radius:7px;font-size:11.5px;color:var(--t5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:default;
  font-variant-numeric:tabular-nums}
.cal-d.has{color:var(--ink);font-weight:600;cursor:pointer;background:var(--brand-soft)}
.cal-d.has:hover{background:#dbe6ea}
.cal-d.sel{background:var(--brand);color:#fff}
.cal-n{font-size:9px;font-weight:600;opacity:.8}
.cal-f{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);display:flex;gap:6px;align-items:center}
.cal-all{flex:1;height:30px;border:1px solid var(--line-mid);border-radius:8px;background:var(--panel);
  font-size:11.5px;font-weight:600;color:var(--t1);cursor:pointer}
.cal-all:hover{background:var(--fill)}
.cal-all.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ===== 누적 막대 그래프 ===== */
.chart{display:flex;align-items:flex-end;gap:8px;padding:16px 17px 10px;height:136px}
.stackbar{width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:5px 5px 0 0;overflow:visible;position:relative}
.seg{width:100%;position:relative;min-height:3px;transition:filter .12s}
.seg:first-child{border-radius:5px 5px 0 0}
.bw:hover .seg{filter:saturate(.55) opacity(.7)}
.bw .seg:hover{filter:none}
.tip{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 6px);
  background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;
  white-space:nowrap;z-index:30;pointer-events:none;box-shadow:0 3px 10px rgba(16,24,40,.2)}
.tip::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:var(--ink)}
.seg:hover .tip{display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 17px 13px;align-items:center}
.lg-i{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--t3)}
.lg-d{width:8px;height:8px;border-radius:2px;flex:none}

/* ===== 산출식 ===== */
.cbox{width:17px;height:17px;border:1.5px solid var(--line-mid);border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:10px;color:transparent;background:var(--panel)}
.cbox.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.icb{width:28px;height:28px;border:1px solid var(--line-mid);border-radius:7px;background:var(--panel);
  color:var(--t3);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.icb:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-tint)}
.icb.act{border-color:var(--edit);color:var(--edit);background:#f3f7fe}
.fx-mark{font-weight:500;color:var(--edit);font-size:11px}
.fx-input{width:100%;height:82px;border:1px solid var(--edit);border-radius:9px;padding:11px 13px;
  font:12.5px/1.7 ui-monospace,Menlo,monospace;background:#f8fbff;color:var(--edit);resize:vertical}
.fx-input:focus{outline:none;border-color:var(--edit)}
.dim-block{opacity:.42;pointer-events:none;filter:grayscale(.35)}
.result.result-mod{background:#f3f7fe;border-color:#dbe6fb}
.inp:disabled{background:var(--fill);color:var(--t4);cursor:not-allowed}

/* ===== (미사용) 수식 편집기 ===== */
.fx-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.fx-str{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.7;
  background:var(--panel-sub);border:1px solid var(--line-soft);border-left:3px solid var(--brand);
  border-radius:0 9px 9px 0;padding:11px 13px;color:var(--ink)}
.fx-str.mod{color:var(--edit);background:#f3f7fe;border-color:#dbe6fb;border-left-color:var(--edit)}
.fx-badge{font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap}
.fx-badge.sys{color:var(--t3);background:var(--fill)}
.fx-badge.mod{color:var(--edit);background:#e8f0fe}
.terms{display:flex;flex-direction:column;gap:5px}
.term-h{display:grid;grid-template-columns:1fr 92px 104px 26px;gap:7px;padding:0 0 3px;
  font-size:10.5px;font-weight:600;color:var(--t4)}
.term{display:grid;grid-template-columns:1fr 92px 104px 26px;gap:7px;align-items:center}
.term-op{font-size:11px;color:var(--t4);font-weight:700;padding:2px 0 0 2px}
.term-n{font-size:12.5px;font-weight:500}
.term-u{font-size:11.5px;color:var(--t4)}
.term-x{width:26px;height:30px;border:1px solid var(--line-mid);border-radius:7px;background:var(--panel);
  color:var(--t4);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.term-x:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.term-add{height:30px;border:1px dashed var(--line-mid);border-radius:8px;background:transparent;
  font-size:11.5px;font-weight:600;color:var(--t3);cursor:pointer;width:100%}
.term-add:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-tint)}
.term-grp{font-size:10.5px;font-weight:700;color:var(--t3);padding:7px 0 3px;letter-spacing:.2px}
.inp.mod{border-color:#c3d6f7;background:#f8fbff}
.cnav{flex:none;width:26px;height:26px;border:1px solid var(--line-mid);border-radius:7px;background:var(--panel);
  cursor:pointer;font-size:11px;color:var(--t2);display:flex;align-items:center;justify-content:center;
  align-self:center;margin-bottom:16px}
.cnav:hover{background:var(--fill)}
.cnav:disabled{opacity:.35;cursor:default}
.bw{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;
  height:100%;background:none;border:0;cursor:pointer;padding:0}
.bv{font-size:11.5px;font-weight:700;color:var(--t2);font-variant-numeric:tabular-nums}
.bar{width:100%;max-width:56px;background:var(--c3);border-radius:5px 5px 0 0;transition:background .15s;min-height:3px}
.bw:hover .bar{background:var(--c2)}
.bw.on .bar{background:var(--brand)}
.bw.on .bv{color:var(--brand)}
.bl{font-size:10.5px;color:var(--t4);white-space:nowrap}
.bw.on .bl{color:var(--ink);font-weight:600}

/* ===== 단계형 ===== */
.step-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--t4);white-space:nowrap}
.step-n{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line-mid);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.step.on{color:var(--ink);font-weight:600}
.step.on .step-n{background:var(--brand);border-color:var(--brand);color:#fff}
.step.dn .step-n{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.step-ar{color:var(--t5);font-size:10px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{text-align:left;font-size:12.5px;padding:10px 13px;border:1px solid var(--line-mid);
  border-radius:10px;background:var(--panel);cursor:pointer;line-height:1.5;max-width:100%}
.opt:hover{border-color:var(--brand);background:var(--brand-tint)}
.pv-r{padding:9px 0;border-bottom:1px solid var(--line-faint)}
.pv-r:last-child{border-bottom:none}
.pv-k{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:3px}
.pv-v{font-size:12.5px;line-height:1.55}
.pv-e{font-size:12px;color:var(--t5)}

/* ===== Logic ===== */
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;color:var(--ink);
  background:var(--panel-sub);border:1px solid var(--line-soft);border-left:3px solid var(--brand);
  border-radius:0 9px 9px 0;padding:11px 13px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld-l{font-size:11px;font-weight:600;color:var(--t3)}
.fld-h{font-size:10.5px;color:var(--t5);line-height:1.5}
.result{display:flex;align-items:center;gap:14px;background:var(--brand-tint);border:1px solid #dbe5e9;
  border-radius:11px;padding:14px 16px}
.result-v{font-size:24px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.pending{color:var(--t4);font-size:15px;font-weight:600;letter-spacing:0}

/* ===== 근거 ===== */
.ev{padding:14px 17px;border-bottom:1px solid var(--line-faint);display:flex;gap:12px}
.ev:last-child{border-bottom:none}
.ev-n{flex:none;width:22px;height:22px;border-radius:6px;background:var(--brand-soft);color:var(--brand);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ev-t{font-size:12.5px;font-weight:600;line-height:1.45}
.ev-s{font-size:11.5px;color:var(--t3);line-height:1.65;margin-top:5px}
.ev-m{font-size:11px;color:var(--t4);margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ev-l{font-size:11px;font-weight:600;color:var(--brand)}
.ev-l:hover{text-decoration:underline}

/* ===== 기타 ===== */
.tog{width:30px;height:18px;border-radius:10px;background:var(--line-mid);padding:2px;display:flex;
  border:0;cursor:pointer;flex:none;transition:background .15s}
.tog.on{background:var(--brand);justify-content:flex-end}
.tog-k{width:14px;height:14px;border-radius:50%;background:#fff}
.tog-row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--t1)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{font-size:13px;font-weight:500;color:var(--t4);padding:9px 13px;cursor:pointer;background:none;border:0;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--brand)}
textarea{width:100%;border:1px solid var(--line-mid);border-radius:10px;padding:12px;
  font:12px/1.75 ui-monospace,Menlo,monospace;resize:vertical;background:var(--panel-sub)}
.empty{padding:52px 20px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid-a{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.dropz{border:1.5px dashed #c3d2d9;background:var(--brand-tint);border-radius:12px;padding:24px 18px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer}

/* ═══════ 일별 건수 차트 ═══════ */
/* 하단 14px — 옆 카드(.pie-wrap 16px)와 균형을 맞춘다. 예전에는 4px 였고, 그 아래
   범례 줄(.clg, padding 8/14 + 텍스트)이 여백을 대신 만들어 주고 있었다. 그 줄이
   빠지면서 날짜 축 라벨이 카드 테두리에 4px 까지 붙었다. */
.cwrap{padding:6px 17px 14px;flex:1;display:flex;flex-direction:column;min-height:0}
.crow{display:flex;align-items:stretch;gap:0}
.cwrap > .crow:first-child{flex:1;min-height:0}
.cyax{flex:none;width:30px;display:flex;flex-direction:column;justify-content:space-between;
  align-items:flex-end;padding-right:8px;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;
  line-height:1}
.cyax.rt{align-items:flex-start;padding:0 0 0 8px;width:36px}
.cyax.sp{height:auto;padding-top:0;padding-bottom:0}
.cplot{flex:1;min-width:0;position:relative;min-height:176px;max-height:250px}
.cgrid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between}
.cgrid span{height:1px;background:var(--line);opacity:.85}
.cgrid span:last-child{background:var(--t5);opacity:.5}
.cbars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:10px;padding:0 4px}
.cb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;
  background:none;border:0;padding:0;cursor:pointer;height:100%;position:relative}
.cbar{width:100%;background:var(--bar);min-height:3px;border-radius:5px 5px 0 0;transition:opacity .12s}
/* 그래프 채도 부스트 — 텁텁함 완화 (다크가 더 물빠진 톤이라 강하게) */
.pie svg,.cbar,.pl-d,.pl-fl{filter:saturate(1.28)}
html[data-theme="dark"] .pie svg,html[data-theme="dark"] .cbar,html[data-theme="dark"] .pl-d,html[data-theme="dark"] .pl-fl{filter:saturate(1.5)}
.cbars:hover .cbar{opacity:.4}
.cb:hover .cbar{opacity:1}
.cb.act .cbar{outline:2px solid var(--ink);outline-offset:2px;border-radius:5px 5px 1px 1px}
.cxax{flex:1;min-width:0;display:flex;gap:10px;padding:7px 4px 0}
.cx{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--t3);cursor:pointer;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.cx:hover{color:var(--brand)}
.cx.act{color:var(--ink);font-weight:700}
.ctip{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);
  background:#161616;color:#fff;border-radius:2px;padding:9px 11px;z-index:40;pointer-events:none;
  min-width:132px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.cb:hover .ctip{display:block}
.ctip-d{font-size:10.5px;color:#c6c6c6;margin-bottom:5px;font-variant-numeric:tabular-nums}
.ctip-r{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
.ctip-v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}

/* ═══════ OC별 구성 (도넛 + 순위 바) ═══════ */
.pie-wrap{display:flex;flex-direction:column;justify-content:center;padding:16px 17px;min-width:0;flex:1}
.pie-top{display:flex;align-items:center;gap:26px;min-width:0}
.pie{width:196px;height:196px;flex:none;position:relative}
.pie svg{width:100%;height:100%;transform:rotate(-90deg)}
.psl{cursor:pointer;transition:opacity .12s, stroke-width .12s}
.pie:hover .psl{opacity:.34}
.pie .psl:hover{opacity:1}
.pie-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none}
.pie-n{font-size:34px;font-weight:700;letter-spacing:-1.4px;line-height:1;font-variant-numeric:tabular-nums}
.pie-u{font-size:11.5px;color:var(--t3);margin-top:6px;font-variant-numeric:tabular-nums;font-weight:600}

.pie-lg{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;
  min-height:242px}
.pl{display:flex;align-items:center;gap:8px;padding:0 4px;cursor:pointer;border:0;background:none;
  width:100%;text-align:left;border-radius:5px;height:26px;flex:none}
.pl:hover{background:var(--panel-sub)}
.pl-d{width:9px;height:9px;border-radius:2px;flex:none}
.pl-n{font-size:11.5px;line-height:1;color:var(--t1);flex:none;width:122px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pl-tr{flex:1;min-width:24px;height:7px;background:var(--line-soft);border-radius:4px;
  overflow:hidden;display:block}
.pl-fl{display:block;height:100%;border-radius:4px}
.pl-v{font-size:11.5px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;width:20px;text-align:right;flex:none}
.pl-p{font-size:10.5px;line-height:1;color:var(--t4);width:32px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.pl.sel{background:var(--brand-tint)}
.pl.sel .pl-n{color:var(--brand)}
.grid-c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.grid-c > .card{display:flex;flex-direction:column;min-width:0}

/* 좁은 폭에서는 두 카드를 세로로 — 파이 줄바꿈·막대 과확대 방지 */
@media (max-width:1340px){
  .grid-c{grid-template-columns:minmax(0,1fr)}
  .cplot{max-height:220px}
}

/* 파이 조각 툴팁 */
.ptip{display:none;position:fixed;z-index:200;background:#161616;color:#fff;border-radius:2px;
  padding:9px 11px;min-width:150px;box-shadow:0 2px 12px rgba(0,0,0,.3);pointer-events:none;
  font-family:inherit}

/* ═══════ 관심 종목 티커 ═══════ */
.ticker{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden;height:46px;display:flex}
.tk-view{flex:1;min-width:0;overflow:hidden;position:relative;display:flex;align-items:center}

<script>
/* ══════════════ 화면 데이터 컨테이너 ══════════════
   값은 전부 GET /api/bootstrap 이 채운다(맨 아래 applyBootstrap). 상수로 들고 있지 않는다.
   const 로 선언한 것은 다른 코드가 이미 잡은 참조를 끊지 않도록 fill() 로 제자리 교체한다. */
const OCS = [];        // [{code,name,biz}] — 계열사
const OC_COLOR = {};   // {code:'#rrggbb'}
const OC = {};         // {code:{code,name,biz}} — applyBootstrap 이 OCS 로부터 재구축

/* ══════════════ 레버별 기대효과 Logic ══════════════
   관리지표(metric)·산출식 문구(text)·입력 항목(fields)은 서버(lever 테이블)에서 내려오고,
   입력값으로 숫자를 실제 계산·표기하는 부분(calc/show)만 화면이 갖는다.
   applyBootstrap 이 서버 3키 + LEVER_CALC 2키를 합성해 LOGIC 을 채운다. */
const LOGIC = {};      // {레버:{metric,text,fields,calc,show}}
const LEVERS = [];     // Object.keys(LOGIC) — applyBootstrap 이 채운다
const N = v => (v===''||v==null||isNaN(Number(String(v).replace(/,/g,'')))) ? 0 : Number(String(v).replace(/,/g,''));

const LEVER_CALC = {
  '정비/TA':{
    calc:f => (f.b!==''&&f.c!=='') ? Number(f.c)*Number(f.b) - N(f.x) : null,
    show:f => `${f.c}일 × ${f.b}억 − 투자비 ${N(f.x)}억`,
  },
  '에너지비':{
    calc:f => (f.a!==''&&f.b!==''&&f.c!==''&&f.d!=='')
      ? Number(f.a)*Number(f.b)/100*Number(f.c)*10000*Number(f.d)/1e8 - N(f.x) : null,
    show:f => `${f.a}kWh/t × ${f.b}% × ${f.c}만t × ${f.d}원 − 투자비 ${N(f.x)}억`,
  },
  '물류비':{
    calc:f => (f.a!==''&&f.b!=='') ? Number(f.a)*Number(f.b)/100 - N(f.x) : null,
    show:f => `${f.a}억 × ${f.b}% − 협상비용 ${N(f.x)}억`,
  },
  '수율':{
    calc:f => (f.a!==''&&f.b!==''&&f.c!=='')
      ? N(f.a)*(Number(f.c)-Number(f.b))/100 - N(f.x) : null,
    show:f => `${f.a}억 × (${f.c}% − ${f.b}%) − 투자비 ${N(f.x)}억`,
  },
  '구매':{
    calc:f => (f.a!==''&&f.b!=='') ? Number(f.a)*Number(f.b)/100 - N(f.x) : null,
    show:f => `${f.a}억 × ${f.b}% − 전환비용 ${N(f.x)}억`,
  },
  '간접비':{
    calc:f => (f.a!==''&&f.b!=='') ? Number(f.a)*Number(f.b)/100 - N(f.x) : null,
    show:f => `${f.a}억 × ${f.b}% − 정리비용 ${N(f.x)}억`,
  },
  '운전자본':{
    calc:f => (f.a!==''&&f.b!==''&&f.c!==''&&f.d!=='')
      ? (Number(f.a)-Number(f.b))*Number(f.c)*Number(f.d)/100 - N(f.x) : null,
    show:f => `(${f.a}일 − ${f.b}일) × ${f.c}억 × ${f.d}% − 투자비 ${N(f.x)}억`,
  },
};
/* 서버에 새 레버가 추가됐는데 계산식이 아직 없을 때 — 화면은 뜨고 금액만 비워 둔다 */
const NO_CALC = {calc:()=>null, show:()=>''};

/* 서버 PUT /api/proposals/{id}/formula 응답 at 과 같은 포맷.
   저장 응답이 오면 그 값으로 덮으므로 여기서는 낙관적 표시용으로만 쓴다. */
const stampNow = () => {
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}. ${p(d.getMonth()+1)}. ${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
/* 자연어 지시로 산출식 재구성 — 데모는 규칙 기반, 실서비스는 LLM 호출 */
const FX_PRESETS = [
  {label:'투자비 빼고 총 효과만', run:b=>b.replace(/\s*[−-]\s*[^−-]*(?:투자비|비용)\s*$/,'')},
  {label:'투자 회수기간으로', run:b=>b.replace(/\s*[−-]\s*([^−-]*(?:투자비|비용))\s*$/,'') + ' ÷ 투자비 × 12 (개월)'},
  {label:'인건비 절감분 추가', run:b=>b + ' + 인건비 절감분'},
  {label:'3년 누적 기준', run:b=>'(' + b + ') × 3년'},
];
function fxFromPrompt(base, s){
  const q = (s||'').trim();
  const hit = FX_PRESETS.find(p=>p.label===q);
  if (hit) return hit.run(base);
  if (/회수\s*기간|회수기간/.test(q))            return FX_PRESETS[1].run(base);
  if (/(투자비|비용).*(빼|제외|없이)/.test(q))     return FX_PRESETS[0].run(base);
  if (/(3\s*년|삼\s*년|누적)/.test(q))           return FX_PRESETS[3].run(base);
  if (/월\s*단위|월별/.test(q))                  return '(' + base + ') ÷ 12';
  const add = q.match(/([가-힣A-Za-z][가-힣A-Za-z\s]{0,10}?)\s*(?:도|를|을|만)?\s*(?:추가|반영|더해|포함)/);
  if (add) return base + ' + ' + add[1].trim();
  const sub = q.match(/([가-힣A-Za-z][가-힣A-Za-z\s]{0,10}?)\s*(?:도|를|을|만)?\s*(?:빼|제외|차감)/);
  if (sub) return base + ' − ' + sub[1].trim();
  return base + ' × 조정 계수';
}
function runFxPrompt(instr){
  const q = (instr||'').trim();
  if(!q) return;
  const t = curTask();
  S.fxAskText = q; S.fxBusy = true; render();
  setTimeout(()=>{
    const base = fxText(t);
    S.fx[t.id] = {text: fxFromPrompt(base, q), at: stampNow(), by: q};
    S.sysOff[t.id] = true;
    S.fxBusy = false; S.fxAsk = null; S.fxAskText = '';
    saveFormula(t).then(render);          // 서버 응답 at 으로 표시 시각을 맞춘다
    render();
  }, 700);
}

/* 산출식 상태 — 시스템 제안(ON, 기본) / 사용자 수식(OFF) */
const sysOn  = t => S.sysOff[t.id] !== true;
const userFx = t => S.fx[t.id];                       // {text, at}
function fxText(t){
  return sysOn(t) ? LOGIC[t.lever].text : (userFx(t)?.text || LOGIC[t.lever].text);
}
/* 산출식 정리 — 단위 주석 괄호(연산자 없는 '(…)')는 제거. 그룹 괄호는 보존 */
function fxClean(formula){ return (formula||'').replace(/\(([^()×✕*÷\/＋+\-−–]*)\)/g,' '); }
function fxTokens(formula){ return fxClean(formula).split(/[×✕*÷\/＋+\-−–=%()]/).map(s=>s.trim()).filter(Boolean); }
/* 입력이 필요한 값(피연산자) = 숫자로 시작하지 않는 항목만 (상수·단위 제외) */
function fxOperands(formula){ return [...new Set(fxTokens(formula).filter(tk => !/^[\d.,]/.test(tk)))]; }
/* 기준값 입력 필드 — 시스템 제안이면 레버 고정 필드, 수정 산출식이면 그 피연산자들 */
function fxFields(t){
  if(sysOn(t)) return LOGIC[t.lever].fields || [];
  return fxOperands(fxText(t)).map(op => ({k:op, l:op, ph:'값 입력'}));
}
/* 커스텀 산출식 계산 — 피연산자가 모두 유효 숫자로 채워지면 금액 반환, 아니면 null */
const fxNum = v => { if(v===''||v==null) return null; const n=Number(String(v).replace(/,/g,'')); return isNaN(n)?null:n; };
function fxCompute(t){
  if(sysOn(t)) return null;
  const ops = fxOperands(fxText(t));
  const vals = S.fields[t.id] || {};
  const nums = ops.map(op => fxNum(vals[op]));
  if(nums.some(n => n===null)) return null;                 // 채울 값이 남아 있으면 계산 안 함
  let expr = fxClean(fxText(t));
  ops.map((op,i)=>[op,nums[i]]).sort((a,b)=>b[0].length-a[0].length)
     .forEach(([op,n]) => { expr = expr.split(op).join('('+n+')'); });
  expr = expr.replace(/(\d[\d.,]*)\s*[가-힣A-Za-z]+/g,'$1')  // 상수 뒤 단위 제거 (3년→3, 12개월→12)
             .replace(/[×✕]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/＋/g,'+').replace(/[%,]/g,'');
  if(!/^[\d\s.+\-*/()]+$/.test(expr)) return null;          // 숫자·연산자만 남았는지 안전 확인
  try{ const r = Function('"use strict";return ('+expr+')')(); return isFinite(r) ? r : null; }
  catch(e){ return null; }
}

function timeline(){
  const by = new Map();
  VERSIONS.filter(v => v.id!=='saved').forEach(v => {
    const g = by.get(v.label) || {label:v.label, ids:[], runs:0};
    g.ids.push(v.id); g.runs++; by.set(v.label, g);
  });
  let run = 0;
  return [...by.values()]
    .sort((a, b) => a.label < b.label ? -1 : (a.label > b.label ? 1 : 0))
    .map(g => { const n = dayCount(g.label); run += n; return {...g, n, cum:run}; });
}
function chartWindow(){
  const tl=timeline();
  const end=Math.max(CHART_N, tl.length-S.cOff), st=Math.max(0,end-CHART_N);
  return {list:tl.slice(st,Math.min(end,tl.length)), st, total:tl.length};
}
function ticks(max){
  const step=Math.max(1,Math.ceil(max/4));
  return {top:step*4, arr:[4,3,2,1,0].map(i=>i*step)};
}
/* 월 목록 (최신 우선) */
function months(){

/* 백분율 최대잉여법 — 합계 100% 보장 */
function pctRound(vals, tot){
  const raw=vals.map(v=>v/tot*100), fl=raw.map(Math.floor);
  let rem=100-fl.reduce((a,b)=>a+b,0);
  const ord=raw.map((r,i)=>({i,f:r-Math.floor(r)})).sort((a,b)=>b.f-a.f);
  const out=fl.slice();
  for(let k=0;k<rem && ord.length;k++) out[ord[k%ord.length].i]++;
  return out;
}
function pieData(ym){
  const vids=VERSIONS.filter(v=>v.label.slice(0,7)===ym).map(v=>v.id);
  const m={}; let tot=0;
  TASKS.filter(t=>vids.includes(t.ver)).forEach(t=>{ m[t.oc]=(m[t.oc]||0)+1; tot++; });
  const rows=OCS.map(o=>o.code).filter(c=>m[c]).map(c=>({oc:c,c:m[c]})).sort((a,b)=>b.c-a.c);
  const pr=pctRound(rows.map(r=>r.c), tot||1);
  rows.forEach((r,i)=>{ r.p=pr[i]; });
  return {rows, tot, vids};
}

  const v = LOGIC[t.lever].calc(fOf(t));

}
function filtered(){

    if (S.ver!=='전체' && labelOf(t.ver)!==S.ver) return false;
    if (S.oc!=='전체' && t.oc!==S.oc) return false;
    if (S.q){

      const hay = (t.name+' '+t.sum+' '+t.lever+' '+ocNm(t.oc)+' '+t.ev.map(e=>EV[e].src).join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
function paged(rows){
  const per=S.per;
  const pages=Math.max(1,Math.ceil(rows.length/per));
  const p=Math.min(S.page,pages);
  return {pages,p,per,slice:rows.slice((p-1)*per,p*per)};
}

function renderCal(){
  const [Y,M] = S.calYM.split('-').map(Number);
  const first = new Date(Y, M-1, 1);
  const days  = new Date(Y, M, 0).getDate();
  const lead  = first.getDay();
  // 생성일 맵 — 하루에 여러 번 재생성하면 버전이 여럿이므로 배열로 모은다.
  // 예전에는 map[d]=v 로 덮어써서 그날 마지막 버전 하나의 건수만 보였다.
  const map = {};
  VERSIONS.forEach(v => { const [y,m,d] = v.label.split('.').map(Number);
    if (y===Y && m===M) (map[d] = map[d] || []).push(v); });
  // 이동 가능 범위
  const labels = VERSIONS.map(v => v.label).sort();
  if(!labels.length) labels.push(S.calYM.replace('-','.')+'.01');
  const minYM = labels[0].slice(0,7).replace('.','-');
  const maxYM = labels[labels.length-1].slice(0,7).replace('.','-');
  const cur = `${Y}-${String(M).padStart(2,'0')}`;

  let cells = '';
  for (let i=0;i<lead;i++) cells += '<span class="cal-d"></span>';
  for (let d=1;d<=days;d++){
    const vs = map[d];
    if (vs){
      const label = vs[0].label, sel = S.ver===label;
      cells += `<button class="cal-d has ${sel?'sel':''}" data-cal-d="${esc(label)}">
        <span>${d}</span><span class="cal-n">${dayCount(label)}</span></button>`;
    } else {
      cells += `<span class="cal-d">${d}</span>`;
    }
  }
  return `<div class="cal" id="cal">
    <div class="cal-h">
      <button class="cal-nav" data-cal-m="-1" ${cur<=minYM?'disabled':''}>‹</button>
      <span class="cal-m">${Y}년 ${M}월</span>
      <button class="cal-nav" data-cal-m="1" ${cur>=maxYM?'disabled':''}>›</button>
    </div>
    <div class="cal-g">${WD.map(w=>`<span class="cal-w">${w}</span>`).join('')}${cells}</div>
    <div class="cal-f">
      <button class="cal-all ${S.ver==='전체'?'on':''}" data-cal-d="전체">전체 누적 (${TASKS.length}건)</button>
    </div>
  </div>`;
}

const PIE_LIGHT = ['#0D47A1','#1976D2','#2196F3','#64B5F6','#BBDEFB','#1565C0','#42A5F5','#90CAF9','#E3F2FD'];
const PIE_DARK  = ['#403D88','#8B639B','#AF719D','#D492A8','#F8B2B2','#5E4A90','#9C6B9C','#C285A8','#E7A6B0'];
function pieCol(oc, i){
  const pal = document.documentElement.getAttribute('data-theme')==='light' ? PIE_LIGHT : PIE_DARK;

}
function chartPie(){
  const MS=months();

      stroke="${col}" stroke-width="6"
      stroke-dasharray="${pct.toFixed(3)} ${(100-pct).toFixed(3)}"
      stroke-dashoffset="${(-acc).toFixed(3)}"
      data-slice="${r.oc}" data-nm="${esc(OC[r.oc].name)}" data-cnt="${r.c}" data-pct="${r.p}"
      data-col="${col}" data-tot="${D.tot}" data-ym="${ym.replace('-','.')}"></circle>`;
    acc+=pct; return el;
  }).join('');

  return `<div class="card">
    <div class="card-h">
      <h2>OC별 구성</h2>
      <div style="margin-left:auto" class="row-f" style="gap:6px">

/* ---------- 관심 종목 시세 ----------
   GET /api/quotes — 네이버 금융 실시간 체결가(폴백은 공공데이터포털 종가). 서버 쪽 사정은
   app/market.py 참고. bootstrap 과 분리한 이유는 app/api/quotes.py 주석 참고.
   값을 못 받은 종목은 숫자 없이 이름과 링크만 그린다. */
let QUOTES = { at:'', quotes:[] };
const wonFmt = n => Number(n).toLocaleString('ko-KR');
function tickerItems(){
  return QUOTES.quotes.map(q=>{
    const has = q.close !== null && q.close !== undefined;
    const up  = has && q.rate > 0, dn = has && q.rate < 0;
    const price = has
      ? `<span class="tk-p num">${wonFmt(q.close)}</span>
         <span class="tk-c num ${up?'up':(dn?'dn':'fl')}">${up?'▲':(dn?'▼':'–')} ${Math.abs(q.rate).toFixed(2)}%</span>`
      : '';
    return `<a class="tk-i ${q.sk?'sk':''}" href="${esc(q.url)}" target="_blank" rel="noopener">
      <span class="tk-nm">${esc(q.name)}</span>${price}
      <span class="tk-go">↗</span></a>`;
  }).join('');
}
function tickerBar(){
  const items=tickerItems();
  if(!items) return '';        // 아직 안 받았으면 자리를 비운다 — 빈 껍데기가 먼저 그려지지 않게
  return `<div class="ticker">
    <div class="tk-view"><div class="tk-track">${items}${items}</div></div>
    <button class="tk-btn" data-goto="trend">트렌드룸</button>
  </div>`;
}

/* 안전 플래그 — store 는 차단 판정 과제도 목록에서 빼지 않고 플래그만 단다.
   화면이 그리지 않으면 걸러진 과제가 정상 과제와 구분 없이 섞인다. */
function flagTags(t){
  return (t.flags||[]).map(f=>
    `<span class="tag ${f.sev==='차단'?'bd':'wn'}" title="${esc(f.msg||'')}">${esc(f.sev||'경고')}</span>`).join('');
}
function flagDots(t){
  const fl = t.flags||[];
  if(!fl.length) return '';
  const blocked = fl.some(f=>f.sev==='차단');
  const tip = fl.map(f=>`${f.sev}: ${f.msg}`).join(' / ');
  return `<span class="tag ${blocked?'bd':'wn'}" style="margin-left:5px" title="${esc(tip)}">${blocked?'차단':'경고'} ${fl.length}</span>`;
}
function gradeTag(t){
  if(t.evalScore==null && !t.grade) return '';
  const g = t.grade || '—';
  const cls = g==='A' ? 'ok' : (g==='C' ? 'bd' : 'wn');
  const by = t.scoredBy==='llm' ? 'LLM 평가' : (t.scoredBy ? esc(t.scoredBy)+' 평가' : '평가');
  return `<span class="tag ${cls}" title="${by}${t.verdict?' · '+esc(t.verdict):''}">${esc(g)}${
    t.evalScore==null?'':` ${f1(t.evalScore)}점`}</span>`;
}

/* 발굴 LLM 이 채우는 본문 — 배경·리스크·기대효과·KPI.
   커스텀 생성이 60초 들여 만드는 산출물이라 화면에 없으면 그 값어치가 사라진다.
   비어 있는 항목은 카드째 그리지 않는다. */
function detailBody(t){
  const rows = [
    ['배경',   t.bg],
    ['리스크', t.risk],
    ['기대효과', t.eff],
    ['KPI',    t.kpi ? (t.kpiFx ? `${t.kpi} — ${t.kpiFx}` : t.kpi) : ''],
  ].filter(r=>r[1]);
  if(!rows.length) return '';
  return `
  <div class="card">
    <div class="card-h"><h2>과제 본문</h2>
      <span class="note" style="margin-left:auto">${esc(t.origin||'')}${
        t.status?` · ${esc(t.status)}`:''}${t.verdict?` · ${esc(t.verdict)}`:''}</span></div>
    <div class="card-b stack" style="gap:13px">
      ${rows.map(([k,v])=>`<div class="stack" style="gap:4px">
        <span class="fld-l">${esc(k)}</span>
        <span style="font-size:12.5px;line-height:1.65;color:var(--t1)">${esc(v)}</span>
      </div>`).join('')}
    </div>
  </div>`;
}
function resultInner(t){
  if (!sysOn(t)){
    const amt = fxCompute(t);
    return `<span style="font-size:11px;font-weight:600;color:var(--edit)">순 기대효과</span>` +
      (amt===null
        ? `<span class="result-v pending" style="color:var(--edit)">값을 모두 입력하면 계산됩니다</span>`
        : `<span class="result-v num" style="color:var(--edit)">${amt>=0?'+':''}${f1(amt)}억<span style="font-size:12px;font-weight:600;color:var(--t3);letter-spacing:0"> / 년</span></span>
           <span class="note mono">${esc(fxText(t))}</span>`);
  }
  const net = netOf(t), f = fOf(t);
  return `<span style="font-size:11px;font-weight:600;color:var(--brand)">순 기대효과 (투자비 차감)</span>` +
    (net===null
      ? `<span class="result-v pending">산정 대기</span>`
      : `<span class="result-v num">${net>=0?'+':''}${f1(net)}억<span style="font-size:12px;font-weight:600;color:var(--t3);letter-spacing:0"> / 년</span></span>
         <span class="note mono">${esc(LOGIC[t.lever].show(f))}</span>`);
}

/* ---------- 커스텀 과제 생성 (비동기 job 폴링) ----------
   POST /api/proposals/custom 은 즉시 job id 를 돌려주고, 발굴 LLM 이 계열사당 60초 안팎
   걸려 배경·리스크·기대효과·KPI 까지 채운다. 완료 응답은 부분 추가가 아니라
   versions+tasks 전량 교체다. */
async function createCustom(force){
  const c = S.cg;
  c.name = (document.getElementById('cgName')?.value || '').trim();
  c.sum  = (document.getElementById('cgSum')?.value  || '').trim();
  c.err  = ''; c.dupId = null;
  if(!c.name){ c.err='과제명을 입력하세요.'; return render(); }
  if(!c.oc || !c.lever){ c.err='대상 OC 와 레버를 먼저 고르세요.'; return render(); }
  c.saving = true; c.phase = '발굴 요청을 보내는 중…'; render();
  let retry = false;   /* 유사 중복 확인 후 재요청 — finally 가 돌고 난 뒤에 다시 부른다 */
  try{
    let d = await api('/api/proposals/custom', {method:'POST', body:{
      oc:c.oc, lever:c.lever, ev:c.ev?[c.ev]:[], plan:c.plan||'', name:c.name, sum:c.sum,
      force: !!force,
    }});
    if(d.job){
      const t0 = Date.now();
      while(d.status === 'running'){
        if(Date.now() - t0 > JOB_MAX_MS) throw new Error('생성이 너무 오래 걸립니다. 잠시 후 다시 시도해 주세요.');
        c.phase = `AI 발굴 중… ${Math.round((Date.now()-t0)/1000)}초 경과`;
        const box = document.getElementById('cgPhase'); if(box) box.textContent = c.phase;
        await new Promise(r => setTimeout(r, JOB_POLL_MS));
        d = await api('/api/proposals/custom/' + encodeURIComponent(d.job));
      }
      if(d.status === 'failed') throw new Error(d.error || '생성에 실패했습니다.');
    }
    applyProposals(d);
    /* 저장 직전 중복 게이트(L2)에 걸린 경우 — 목록은 갱신하되 '추가됐습니다' 라고 하지 않는다. */
    if(d.id == null && d.reason){ c.err = d.reason; c.dupId = d.dupId || null; return; }
    if(d.id!=null) S.curId = d.id;
    if(d.ver) S.ver = '전체';
    c.done = true; c.err = '';
  }catch(e){
    const dd = e.data || {};
    /* 유사 중복은 오탐이 실재하므로 확인 후 진행 경로를 준다. 완전일치는 여기로 오지 않는다. */
    if(dd.code === 'duplicate_similar' && !force){
      if(confirm(dd.detail + '\n\n그래도 새 과제로 만들까요?')) retry = true;
      else { c.err = ''; c.dupId = dd.id || null; }
    } else {
      c.dupId = dd.id || null;
      c.err = dd.code ? dd.detail : ('과제 생성에 실패했습니다. ' + e.message);
    }
  }finally{
    c.saving = false; c.phase = ''; render();
  }
  if(retry) return createCustom(true);
}

/* 조립된 프롬프트를 읽기 좋은 형태로 렌더링 (복사·내보내기는 마크다운 원문 유지) */
function promptHtml(txt){
  const L = txt.split('\n');
  const out = [];
  let i = 0, bul = [], par = [];
  const flushBul = () => { if(bul.length){ out.push(`<ul class="pp-ul">${bul.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`); bul=[]; } };
  const flushPar = () => { if(par.length){ out.push(`<div class="pp-p">${esc(par.join(' '))}</div>`); par=[]; } };
  const flush = () => { flushPar(); flushBul(); };

  while(i < L.length){
    const raw = L[i], t = raw.trim();
    if(t === ''){ flush(); i++; continue; }
    if(t === '---'){ flush(); out.push('<div class="pp-div"></div>'); i++; continue; }
    if(t.startsWith('# ')){ flush(); out.push(`<div class="pp-h1">${esc(t.slice(2))}</div>`); i++; continue; }
    if(t.startsWith('## ')){ flush(); out.push(`<div class="pp-h2">${esc(t.slice(3))}</div>`); i++; continue; }

    // 추가 자료 블록 — 이후 내용을 점선 박스에 담음
    if(t.startsWith('[▼')){
      flush();
      const label = t.replace(/^\[▼\s*/,'').replace(/\]$/,'');
      i++;
      const rest = [];
      while(i < L.length){ rest.push(L[i]); i++; }
      const body = rest.join('\n').trim();
      const empty = (body === '' || body === '(미입력)');
      out.push(`<div class="pp-add ${empty?'pp-empty':''}">
        <div class="pp-add-l">${esc(label)}</div>
        <div class="pp-add-b">${empty?'아직 입력된 자료가 없습니다':esc(body).replace(/\n/g,'<br>')}</div>
      </div>`);
      continue;
    }

    // 벤치마크 사례 — "- [날짜 · 매체 · 유형] 제목" + 들여쓴 본문/출처
    const m = t.match(/^- \[(.+?)\]\s*(.*)$/);
    if(m){
      flush();
      const meta = m[1].split('·').map(s=>s.trim()).filter(Boolean);
      const title = m[2];
      let body = '', url = '';
      i++;
      while(i < L.length && /^\s{2,}\S/.test(L[i])){
        const s = L[i].trim();
        if(s.startsWith('출처:')) url = s.slice(3).trim();
        else body += (body ? ' ' : '') + s;
        i++;
      }
      out.push(`<div class="pp-c">
        <div class="pp-c-m">${meta.map((x,k)=>`<span class="${k===1?'pp-src':''}">${esc(x)}</span>`).join('<span class="pp-dot">·</span>')}</div>
        <div class="pp-c-t">${esc(title)}</div>
        ${body?`<div class="pp-c-b">${esc(body)}</div>`:''}
        ${url?`<a class="pp-c-u" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)} ↗</a>`:''}
      </div>`);
      continue;
    }

    if(t.startsWith('- ')){ flushPar(); bul.push(t.slice(2)); i++; continue; }
    if(/^[가-힣A-Za-z ]{1,8}:$/.test(t)){ flush(); out.push(`<div class="pp-sub">${esc(t)}</div>`); i++; continue; }

    flushBul();
    par.push(t);
    i++;
  }
  flush();
  return out.join('');
}

/* ---------- 5. AI Reporting ---------- */
/* 서로 다른 표기의 시각을 같은 자릿수 숫자열로 맞춘다.
     '2026.08.07 17:46'(report_setting.last_at) → '202608071746'
     '2026-08-07T00:38:27'(proposal.created_at) → '202608070038'
   ★ 문자열 비교를 하기 전에 반드시 이걸 통과시켜라. 점·하이픈이 섞이면 '-'(45) < '.'(46)
     이라 비교가 통째로 뒤집힌다(실측: 치환만 했더니 발송 후에도 75/75 전량이 대상). */
const tsKey = s => (s||'').replace(/[-.T: ]/g, '').slice(0, 12);

/* 지난 발송 이후 생성된 과제 = 발송 대상 기본값.
   ★ 버전이 아니라 **과제 자신의 생성 시각**으로 판정한다. 커스텀 과제는 그날 이미 있는
     버전에 붙으므로(ver_id 재사용), 버전 시각으로 보면 방금 만든 과제가 '지난 발송 이전'
     으로 분류돼 조용히 빠진다. 과제에 시각이 없으면(옛 행) 버전 시각으로 폴백한다.
   ★ 날짜가 아니라 시각까지 본다. 예전에는 날짜만 비교해서, 발송한 날 만든 과제가
     그날 하루 통째로 대상에서 빠졌다('2026.08.07' > '2026.08.07' 은 거짓). */
function sendTargets(){
  const last = tsKey(S.send.lastAt);       // 발송 이력이 없으면 '' → 전량이 대상
  if(!last) return TASKS.slice();
  return TASKS.filter(t => tsKey(t.at || (verOf(t.ver)||{}).at || '') > last);
}
/* 발송 포함 판정 — 기본값은 '최근 3일 생성 과제', 검색으로 다른 과제도 추가 가능 */
function rpTaskDate(t){
  const s=(t.at || (verOf(t.ver)||{}).label || '').slice(0,10).replace(/-/g,'.');
  const p=s.split('.').map(Number);
  return (p.length===3 && p.every(n=>!isNaN(n))) ? new Date(p[0],p[1]-1,p[2]) : null;
}
function rpIsRecent(t, days){
  const d=rpTaskDate(t); if(!d) return false;
  const cut=new Date(TR_TODAY.getFullYear(),TR_TODAY.getMonth(),TR_TODAY.getDate()-(days-1));
  return d>=cut;
}
function rpIncluded(t){ return S.sendSel ? !!S.sendSel[t.id] : rpIsRecent(t,3); }
function rpMaterialize(){ if(!S.sendSel){ S.sendSel={}; TASKS.forEach(t=>{ if(rpIsRecent(t,3)) S.sendSel[t.id]=true; }); } }
const sendIncluded = () => TASKS.filter(rpIncluded);

function viewReport(){

  const rpList = (rpq ? TASKS.filter(t=>(t.name||'').toLowerCase().includes(rpq)) : TASKS.filter(t=>rpIsRecent(t,3)))
    .sort((a,b)=>(rpTaskDate(b)||0)-(rpTaskDate(a)||0));
  const FREQ = ['발송 안함','매일','주 3회','주 1회'];
  return `

/* ═══════════════ 트렌드룸 (개선) ═══════════════
   기간·분야 단위 AI 동향 요약 + 상위 테마 + 자료 목록.
   요약은 기간/분야 선택에만 반응하고, 아래 목록 필터와는 분리됩니다. */

const BIZ_C = {};       // {사업부문:'#rrggbb'} — bizColor
const EV_BIZ_FB = {};   // {자료키:사업부문} — 인용 과제가 없을 때의 폴백
const EV_NEW = {};      // {자료키:1} — 오늘 수집분
/* 트리맵 색 램프 키 — 표시 규칙이라 화면이 갖는다. 미등록 사업부문은 기본 램프로 떨어뜨린다. */
const TM_HUE = {'에너지·화학':'b','배터리·소재':'t','LNG·전력':'p'};
const tmHue = bz => TM_HUE[bz] || 'b';
/* 자료별 브리핑 — 무슨 일이 있었고 우리에게 무슨 의미인지 (feed_item.brief).
   비어 있으면 키 자체가 없고, 화면은 자료 요약(e.sum)으로 떨어진다. */
const EV_BRIEF = {};
/* 분야별 브리핑 리드 문장 */
const BRIEF_LEAD = {
  '전체':'비용 항목을 개별로 깎기보다 운영 순서와 계약 구조를 다시 짜는 쪽으로 흐름이 모이고 있습니다.',
  '에너지·화학':'정비 일정과 유틸리티 운영을 재배치해 고정비를 흡수하려는 움직임이 이어지고 있습니다.',
  '배터리·소재':'검사 자동화와 라인 통합으로 수율과 고정비를 동시에 건드리는 접근이 확산되고 있습니다.',
  'LNG·전력':'터미널 운영비를 스케줄 연동으로 압축하는 방식이 수익성 관리의 축으로 제시되고 있습니다.',
};
/* 자료별 추출 키워드 — 사전 기반 결정론 추출 + LLM 결과 덮어쓰기 (feed_item_keyword) */
const EV_KW = {};       // {자료키:['정기보수','공기 단축',…]} 최대 4개
/* 자료 → 관련 계열사 (feed_item_tag) */
const EV_OC = {};       // {자료키:['SKGC','SKE']}
/* 직전 스냅샷 대비 언급 증감 (keyword_daily). 비교 기준이 없으면 {} 이고 화면은 전부 '–' 로 그린다. */
const KW_TREND = {};    // {키워드: +3 | -1}
/* OC별 수집 현황 — 히트맵 집계 */
function ocMatrix(scope){
  const m = {}; OCS.forEach(o => m[o.code] = {n:0, kws:{}});
  scope.forEach(k => {
    (EV_OC[k]||[]).forEach(c => {
      if(!m[c]) return;
      if(S.trBiz!=='전체' && OC[c].biz!==S.trBiz) return;
      m[c].n++;
      (EV_KW[k]||[]).forEach(w => { m[c].kws[w] = (m[c].kws[w]||0)+1; });
    });
  });
  const max = Math.max(1, ...OCS.map(o=>m[o.code].n));
  return {m, max};
}
/* 스쿼리파이드 트리맵 — 값에 비례해 사각형 배치 (Finviz 방식) */
function squarify(items, X, Y, W, H){
  const list = items.filter(i=>i.v>0).sort((a,b)=>b.v-a.v);
  if(!list.length) return [];
  const total = list.reduce((s,i)=>s+i.v,0);
  const scale = (W*H)/total;
  const q = list.map(i=>({...i, a:i.v*scale}));
  const out = [];
  let x=X, y=Y, w=W, h=H, row=[], i=0;

  const worst = (r, len) => {
    if(!r.length) return Infinity;
    const s = r.reduce((a,b)=>a+b.a,0);
    const mx = Math.max(...r.map(z=>z.a)), mn = Math.min(...r.map(z=>z.a));
    return Math.max((len*len*mx)/(s*s), (s*s)/(len*len*mn));
  };
  const flush = () => {
    const s = row.reduce((a,b)=>a+b.a,0);
    if(w >= h){
      const rw = s/h; let oy = y;
      row.forEach(r=>{ const rh=r.a/rw; out.push({...r, x, y:oy, w:rw, h:rh}); oy+=rh; });
      x += rw; w -= rw;
    } else {
      const rh = s/w; let ox = x;
      row.forEach(r=>{ const rw2=r.a/rh; out.push({...r, x:ox, y, w:rw2, h:rh}); ox+=rw2; });
      y += rh; h -= rh;
    }
    row = [];
  };
  while(i < q.length){
    const len = Math.min(w,h);
    if(!row.length || worst(row,len) >= worst(row.concat([q[i]]),len)){ row.push(q[i]); i++; }
    else flush();
  }
  if(row.length) flush();
  return out;
}
/* OC 트리맵 — 사업부문 2단 배치 */
function ocTreemap(HM){
  const W = 1000, H = 330;
  const bizList = Object.keys(BIZ_C)
    .filter(bz => S.trBiz==='전체' || bz===S.trBiz)
    .map(bz=>({
    k:bz, v:OCS.filter(o=>o.biz===bz).reduce((s,o)=>s+HM.m[o.code].n,0)
  }));
  const outer = squarify(bizList, 0, 0, W, H);
  const cells = [];
  outer.forEach(g=>{
    const list = OCS.filter(o=>o.biz===g.k).map(o=>({k:o.code, v:HM.m[o.code].n}));
    squarify(list, g.x, g.y, g.w, g.h).forEach(c=>cells.push({...c, biz:g.k}));
  });
  return {cells, groups:outer, W, H};
}

/* 오늘 수집분 키워드 빈도 — 기간 필터와 무관하게 당일 기준 */
function kwToday(){
  const todays = Object.keys(EV).filter(k=>EV_NEW[k]);
  const c = {};
  todays.forEach(k => (EV_KW[k]||[]).forEach(w => { c[w]=(c[w]||0)+1; }));
  const rows = Object.keys(c).map(w=>({w, n:c[w], d:KW_TREND[w]||0}))
    .sort((a,b)=> b.n-a.n || a.w.localeCompare(b.w));
  return {rows, max: rows.length?rows[0].n:1, n: todays.length};
}

const KIND_MAP = {};                 // {kind_label: 종류 카테고리} — 서버 kindMap
const TR_KINDS = ['전체'];           // ['전체'].concat(서버 kinds)
const TR_BIZS  = ['전체'];           // ['전체'].concat(Object.keys(bizColor))
const TR_PERIODS = [
  {k:'7d', l:'최근 1주', d:7}, {k:'1m', l:'최근 1개월', d:30}, {k:'3m', l:'최근 3개월', d:91},
  {k:'6m', l:'최근 6개월', d:182}, {k:'all', l:'전체', d:9999}, {k:'custom', l:'직접 설정', d:0},
];
/* 기준일 — 서버 today(config.TODAY)가 유일한 출처. applyBootstrap 이 재대입하므로 let 이다. */
let TR_TODAY = new Date();

function evRefs(k){ return TASKS.filter(t=>t.ev.includes(k)); }
function evOCs(k){ return [...new Set(evRefs(k).map(t=>t.oc))]; }
function evBiz(k){ const b=[...new Set(evOCs(k).map(c=>OC[c].biz))]; return b.length?b:[EV_BIZ_FB[k]]; }
/* 매핑에 없는 종류 라벨은 원문 라벨을 그대로 둔다 — 임의로 'IR·보고서' 에 밀어 넣으면
   그 카테고리를 고른 사용자에게 관계없는 자료가 섞여 나온다. */
function evKind(k){ return KIND_MAP[EV[k].kind] || EV[k].kind || ''; }

const trPd    = s => { const [y,m,d]=s.split('.').map(Number); return new Date(y, m-1, d); };
const trIso   = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const trDot   = dt => dt.getFullYear()+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+String(dt.getDate()).padStart(2,'0');
const trMD    = dt => String(dt.getMonth()+1).padStart(2,'0')+'.'+String(dt.getDate()).padStart(2,'0');
const trShift = (dt,n) => { const x=new Date(dt); x.setDate(x.getDate()-n); return x; };
const trMon   = dt => { const x=new Date(dt); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; };

function trRange(){
  if (S.trPeriod==='custom')
    return [new Date(S.trFrom+'T00:00:00'), new Date(S.trTo+'T23:59:59')];
  const p = TR_PERIODS.find(x=>x.k===S.trPeriod) || TR_PERIODS[1];
  // 상한도 기준일에서 뽑는다 — 하한만 움직이면 기준일 이후 자료가 통째로 기간 밖으로 밀린다.
  return [trShift(TR_TODAY, p.d),
          new Date(TR_TODAY.getFullYear(), TR_TODAY.getMonth(), TR_TODAY.getDate(), 23, 59)];
}
/* 기간 + 분야까지만 적용한 집합 — AI 요약·상위 테마의 모집단 */
function trScope(){
  const [f,t] = trRange();
  return Object.keys(EV).filter(k=>{
    const d = trPd(EV[k].date);
    if (d<f || d>t) return false;
    if (S.trBiz!=='전체' && !evBiz(k).includes(S.trBiz)) return false;
    return true;
  });
}

function viewTrend(){
  const scope = trScope();
  const [f,t] = trRange();
  const pLabel = (TR_PERIODS.find(p=>p.k===S.trPeriod)||TR_PERIODS[1]).l;
  const scopeSpan = S.trPeriod==='all' ? `수집 전 기간 · ~${trDot(t)}` : `${trDot(f)} – ${trDot(t)}`;
  const bizLabel = S.trBiz==='전체' ? '전 분야' : S.trBiz;

  const HM = ocMatrix(scope);
  const TM = ocTreemap(HM);
  const KW = kwToday();
  const srcList = ['전체', ...[...new Set(Object.keys(EV).map(k=>EV[k].src))].sort()];

  /* ── 데일리 브리핑 — 최근 주요 소식 ── */
  const lead = BRIEF_LEAD[S.trBiz] || BRIEF_LEAD['전체'];
  const briefRows = scope.slice()
    .sort((a,b)=> (trPd(EV[b].date)-trPd(EV[a].date)) || (evRefs(b).length-evRefs(a).length))
    .slice(0,3);

  /* ── 목록 필터 ── */
  const q = (S.trQ||'').trim().toLowerCase();
  let rows = scope.filter(k=>{
    const e = EV[k];
    if (S.trKw && !(EV_KW[k]||[]).includes(S.trKw)) return false;
    if (S.trOc && !(EV_OC[k]||[]).includes(S.trOc)) return false;
    if (S.trSrc!=='전체' && e.src!==S.trSrc) return false;
    if (S.trKind!=='전체' && evKind(k)!==S.trKind) return false;
    if (S.trNew && !EV_NEW[k]) return false;
    if (S.trUnl && evRefs(k).length>0) return false;
    if (q && !(e.title+e.sum+e.src+(EV_KW[k]||[]).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
  rows.sort((a,b)=> S.trSort==='cite'
    ? (evRefs(b).length-evRefs(a).length) || (trPd(EV[b].date)-trPd(EV[a].date))
    : trPd(EV[b].date)-trPd(EV[a].date));

  /* ── 페이지네이션 (10건씩) — 필터·검색·정렬이 바뀌면 1페이지로 되돌린다 ── */
  const TR_PAGE=10;
  const trSig=[S.trKw,S.trOc,S.trSrc,S.trKind,S.trNew,S.trUnl,q,S.trSort,S.trBiz,S.trPeriod,S.trFrom,S.trTo].join('|');
  if(trSig!==S._trSig){ S._trSig=trSig; S.trPage=1; }
  const trPages=Math.max(1, Math.ceil(rows.length/TR_PAGE));
  const trPg=Math.min(Math.max(1, S.trPage||1), trPages);
  const pageRows=rows.slice((trPg-1)*TR_PAGE, trPg*TR_PAGE);

  /* ── 주차 그룹핑 (현재 페이지 기준) ── */
  const groups=[];
  pageRows.forEach(k=>{
    const d=trPd(EV[k].date), m0=trMon(d), key=trIso(m0);
    let g=groups.find(x=>x.key===key);
    if(!g){
      const nth=Math.floor((m0.getDate()-1)/7)+1;
      g={key, label:`${m0.getMonth()+1}월 ${nth}주`, sub:`${trMD(m0)} – ${trMD(trShift(m0,-6))}`, rows:[]};
      groups.push(g);
    }
    g.rows.push(k);
  });

  const rowHtml = k=>{
    const e=EV[k], n=evRefs(k).length;
    return `<div class="tr2-row">
      <div class="tr2-d">
        <span class="tr2-dd">${esc(trMD(trPd(e.date)))}</span>
        ${trIso(trPd(e.date))===trIso(TR_TODAY)?'<span class="nb">NEW</span>':''}
      </div>
      <div class="tr2-m">
        <div class="row-f" style="gap:7px">
          <span style="font-size:11.5px;font-weight:700">${esc(e.src)}</span>
          <span style="font-size:11px;color:var(--t5)">·</span>
          <span style="font-size:11px;color:var(--t3)">${esc(evKind(k))}</span>
          ${(EV_OC[k]||[]).slice(0,2).map(c=>`<span class="tag oc">${esc(ocNm(c))}</span>`).join('')}
        </div>
        <div class="tr2-t">${esc(e.title)}</div>
        <div class="tr2-s">${esc(e.sum)}</div>
        <div class="kwline">${(EV_KW[k]||[]).map(w=>
          `<button class="kwmini ${S.trKw===w?'on':''}" data-tr="kw:${esc(w)}">${esc(w)}</button>`).join('')}</div>
      </div>
      <div class="tr2-a">

/* ── 트렌드룸 인터랙션 ── */
function trBump(){
  const b=document.getElementById('aiBody');
  if(b){ b.style.opacity='.35'; }
  clearTimeout(window.__trT);
  window.__trT=setTimeout(()=>{ S.trGenAt='방금'; render(); }, 420);
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-tr]'); if(!el) return;
  const raw=el.dataset.tr, i=raw.indexOf(':');
  const k=raw.slice(0,i), v=raw.slice(i+1);
  if(k==='biz'){ S.trBiz=v; render(); return trBump(); }
  if(k==='period'){ S.trPeriod=v; render(); return trBump(); }
  if(k==='regen'){ return trBump(); }
  if(k==='pg'){ S.trPage=Math.max(1,Number(v)); return render(); }
  if(k==='kw'){ S.trKw = (S.trKw===v?null:v); return render(); }
  if(k==='oc'){ S.trOc = (S.trOc===v?null:v); return render(); }
  if(k==='new'){ S.trNew=!S.trNew; return render(); }
  if(k==='unl'){ S.trUnl=!S.trUnl; return render(); }
  if(k==='clear'){ S.trKw=null; S.trOc=null; S.trQ=''; S.trKind='전체'; S.trSrc='전체'; S.trNew=false; S.trUnl=false; return render(); }
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.id==='fxAskI'){ S.fxAskText=el.value; return; }
  if(el.id==='trBizSel'){ S.trBiz = el.value==='전 분야'?'전체':el.value; render(); return trBump(); }
  if(el.id==='trPdSel'){ S.trPeriod = el.value; render(); return trBump(); }
  if(el.id==='trSrc'){ S.trSrc = el.value==='출처 전체'?'전체':el.value; return render(); }
  if(el.id==='trKind'){ S.trKind = el.value==='종류 전체' ? '전체' : el.value; return render(); }
  if(el.id==='trSort'){ S.trSort=el.value; return render(); }
  if(el.id==='trFrom'){ S.trFrom=el.value; render(); return trBump(); }
  if(el.id==='trTo'){ S.trTo=el.value; render(); return trBump(); }
});
function rerenderSearch(id){
  render();
  const n=document.getElementById(id);
  if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
}
document.addEventListener('input', e=>{
  if(e.target.id!=='trQ') return;
  S.trQ=e.target.value;
  if(e.isComposing) return;        // 한글 조합(IME) 중엔 렌더로 입력창을 재생성하지 않는다
  rerenderSearch('trQ');
});
/* 조합이 끝나면(음절 완성/확정) 그때 목록을 갱신한다 — trQ·q 공통 */
document.addEventListener('compositionend', e=>{
  const id=e.target && e.target.id;
  if(id==='trQ'){ S.trQ=e.target.value; rerenderSearch('trQ'); }
  else if(id==='q'){ S.q=e.target.value; S.page=1; rerenderSearch('q'); }
  else if(id==='rpSearch'){ S.rpQ=e.target.value; rerenderSearch('rpSearch'); }
});

/* ═══════════════ 파이 조각 툴팁 ═══════════════ */
let PT=null;
function ptip(){
  if(!PT){ PT=document.createElement('div'); PT.className='ptip'; document.body.appendChild(PT); }
  return PT;
}
function ptShow(s,e){
  const t=ptip();
  t.innerHTML = `<span class="ctip-d">${esc(s.dataset.ym)} · 전체 ${s.dataset.tot}건</span>
    <span class="ctip-r"><span class="ctip-s" style="background:${s.dataset.col}"></span>
      ${esc(s.dataset.nm)}<span class="ctip-v">${s.dataset.cnt}건</span></span>
    <span class="ctip-f"><span>비중 ${s.dataset.pct}%</span></span>`;
  t.style.display='block';
  ptMove(e);
}
function ptMove(e){
  const t=ptip(); const r=t.getBoundingClientRect();
  let x=e.clientX-r.width/2, y=e.clientY-r.height-12;
  x=Math.max(8,Math.min(x,window.innerWidth-r.width-8));
  if(y<8) y=e.clientY+16;
  t.style.left=x+'px'; t.style.top=y+'px';
}
function ptHide(){ if(PT) PT.style.display='none'; }
document.addEventListener('mouseover',e=>{ const s=e.target.closest?.('.psl'); if(s) ptShow(s,e); });
document.addEventListener('mousemove',e=>{ if(!PT||PT.style.display==='none')return;
  const s=e.target.closest?.('.psl'); if(s) ptMove(e); else ptHide(); });
document.addEventListener('mouseout',e=>{ if(e.target.closest?.('.psl')) ptHide(); });

/* ---------- 계정 관리 (관리자 API 연동) ---------- */
function admAuth(){ return { Authorization:'Bearer '+(localStorage.getItem('oi-token')||'') }; }
async function loadAdminUsers(){
  S.usersErr='';
  try{
    const r=await fetch('/api/admin/users',{headers:admAuth()});
    if(r.status===403){ S.usersErr='관리자 권한이 있는 계정만 사용자 관리를 사용할 수 있습니다.'; S.users=[]; }
    else if(!r.ok){ S.usersErr='목록을 불러오지 못했습니다.'; S.users=[]; }
    else { const d=await r.json(); S.users=d.users||[]; }
  }catch(e){ S.usersErr='백엔드에 연결할 수 없습니다. 서버(8000)가 실행 중인지 확인하세요.'; S.users=[]; }
  S.usersLoaded=true; render();
}
async function adminAddUser(){
  const email=(document.getElementById('nuEmail')?.value||'').trim();
  const isAdm=!!document.getElementById('nuAdmin')?.checked;
  S.usersMsg='';
  if(!email){ S.usersErr='이메일을 입력하세요.'; return render(); }
  try{
    const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json',...admAuth()},body:JSON.stringify({email,is_admin:isAdm})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ S.usersErr=d.detail||'추가에 실패했습니다.'; return render(); }
    S.usersErr=''; S.usersMsg=`${d.email} 추가됨 · 초기 비밀번호 ${d.initial_password}`;
    return loadAdminUsers();
  }catch(e){ S.usersErr='서버 연결 오류'; return render(); }
}
async function adminResetPw(email){
  if(!confirm(`${email} 의 비밀번호를 1111 로 초기화할까요?`)) return;
  try{
    const r=await fetch(`/api/admin/users/${encodeURIComponent(email)}/reset-password`,{method:'POST',headers:admAuth()});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ alert(d.detail||'초기화 실패'); return; }
    alert(`${email} 의 비밀번호가 1111 로 초기화되었습니다.`);
  }catch(e){ alert('서버 연결 오류'); }
}
async function adminDelUser(email){
  if(!confirm(`${email} 계정을 삭제할까요? 되돌릴 수 없습니다.`)) return;
  try{
    const r=await fetch(`/api/admin/users/${encodeURIComponent(email)}`,{method:'DELETE',headers:admAuth()});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ alert(d.detail||'삭제 실패'); return; }
    S.usersMsg=`${email} 삭제됨`; loadAdminUsers();
  }catch(e){ alert('서버 연결 오류'); }
}
