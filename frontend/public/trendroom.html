/* ══════════════ 동작 ══════════════ */
function download(name,text,mime){
  const blob=new Blob(['\uFEFF'+text],{type:(mime||'text/plain')+';charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const CSV_COLS=['과제ID','생성일','OC','과제명','레버','요약','적용방안','관리지표','기대효과 Logic','순 기대효과(억)','벤치마크','원문 URL','과제 점수','피드백'];
function exportCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/\r?\n/g,' / ').replace(/"/g,'""')+'"';
  const rows=filtered().map(t=>{
    const net=netOf(t);
    return ['OI-2026-'+t.id, (verOf(t.ver)||{}).label||t.at||'', ocNm(t.oc), t.name, t.lever, t.sum, t.plan,
      LOGIC[t.lever].metric, fxText(t), net===null?(sysOn(t)?'산정 대기':'사용자 수식'):f1(net),
      t.ev.map(e=>`${EV[e].src}(${EV[e].date})`).join('; '),
      t.ev.map(e=>EV[e].url).join('; '),
      fbOf(t.id).s || '', fbOf(t.id).t || ''].map(q).join(',');
  });
  download(`OI_Spark_과제_${(S.ver==='전체'?'전체':S.ver).replace(/\./g,'')}.csv`,
    CSV_COLS.map(q).join(',')+'\n'+rows.join('\n'),'text/csv');
}
/* 재생성 — 서버 job. 클라이언트 상수에서 꺼내는 연출이 아니라 DB 에 실제로 남는다. */
async function regenerate(){
  S.regenerating = true; render();
  try{
    let d = await api('/api/proposals/regenerate', {method:'POST'});
    if(d.job){
      const t0 = Date.now();
      while(d.status === 'running'){
        if(Date.now() - t0 > JOB_MAX_MS) throw new Error('재생성이 너무 오래 걸립니다. 잠시 후 다시 시도해 주세요.');
        await new Promise(r => setTimeout(r, JOB_POLL_MS));
        d = await api('/api/proposals/regenerate/' + encodeURIComponent(d.job));
      }
      if(d.status === 'failed') throw new Error(d.error || '재생성에 실패했습니다.');
    }
    if(d.ver === null){                    // 새로 저장할 과제가 하나도 없었다 — 사유를 그대로 보여준다
      alert(d.reason || '새로 만들 과제가 없습니다.');
      return;
    }
    applyProposals(d);
    // 서버는 새 **버전 id** 를 주는데 S.ver 는 생성일을 담는다 — 날짜로 바꿔 넣는다.
    S.ver = labelOf(d.ver) || '전체'; S.page = 1; S.cOff = 0; S.calOpen = false;
  }catch(e){
    alert('재생성에 실패했습니다. ' + e.message);
  }finally{
    S.regenerating = false; render();
  }
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-nav],[data-open],[data-lv],[data-ver],[data-pg],[data-atab],[data-tn],[data-ch],[data-ex-d],[data-dl],[data-rm-rc],[data-cg-oc],[data-cg-ev],[data-cg-lv],[data-cg-plan],[data-cal-d],[data-cal-m],[data-cnav],[data-fxp],[data-sendtog],[data-freq],[data-monav],[data-slice],[data-memo],[data-star],[data-msave],[data-ck],[data-ckall],[data-goto],[data-tr],[data-cite],button');
  // 캘린더 외부 클릭 시 닫기
  if(S.calOpen && !e.target.closest('#cal') && el && el.id!=='calBtn'){ S.calOpen=false; }
  if(S.calOpen && !el){ S.calOpen=false; return render(); }
  if(!el) return;
  const d=el.dataset;
  if(d.fxp){ return runFxPrompt(d.fxp); }
  if(d.nav){e.preventDefault(); return navigate(d.nav);}
  if(d.open){return navigate('detail', {curId:Number(d.open)});}
  if(d.ver){S.ver=(S.ver===d.ver?'전체':d.ver); S.page=1; S.calOpen=false; return render();}
  if(d.monav){ const len=months().length;
    S.moIdx=Math.min(Math.max(0,S.moIdx+Number(d.monav)),len-1); return render(); }
  if(d.slice){ S.oc=(S.oc===d.slice?'전체':d.slice); S.page=1; return render(); }
  if(d.memo){ S.memoOpen=(String(S.memoOpen)===String(d.memo)?null:d.memo); return render(); }
  if(d.star){ const [id,n]=d.star.split(':');
    S.fb[id]=S.fb[id]||{s:0,t:''}; S.fb[id].s=Number(n);
    saveFeedback(id, {score:Number(n)});          // 점수와 메모는 따로 보낸다
    return render(); }
  if(d.msave){ const id=d.msave;
    const box=document.querySelector(`[data-fbt="${id}"]`);
    if(box){ S.fb[id]=S.fb[id]||{s:0,t:''}; S.fb[id].t=box.value; }
    clearTimeout(memoTimers[id]);                 // 디바운스 대기 중인 것과 겹치지 않게
    saveFeedback(id, {memo:(S.fb[id]||{}).t||''});
    el.textContent='저장됨'; setTimeout(()=>{S.memoOpen=null; render();},850); return; }
  if(d.ck){ const id=d.ck; if(S.sel[id]) delete S.sel[id]; else S.sel[id]=true; return render(); }
  if(d.ckall){ const rs=filtered();
    const on=rs.length>0 && rs.every(t=>S.sel[t.id]);
    if(on) rs.forEach(t=>delete S.sel[t.id]); else rs.forEach(t=>S.sel[t.id]=true);
    return render(); }
  if(d.goto){ return navigate(d.goto); }
  if(d.cite){ S.q=EV[d.cite].src; S.oc='전체'; S.page=1; return navigate('list'); }
  if(d.cnav){
    const total=timeline().length;      // 막대 수 = 생성일 수 (버전 수가 아니다)
    S.cOff = Math.min(Math.max(0, S.cOff + Number(d.cnav)*3), Math.max(0,total-CHART_N));
    return render();
  }
  if(d.calD){
    S.ver = d.calD; S.page=1; S.calOpen=false;
    if(d.calD!=='전체'){ // 선택한 생성일이 그래프에 보이도록 윈도우 조정
      // 윈도우 좌표는 **날짜 축**이다 — VERSIONS(버전 축)로 세면 같은 날 재생성이
      // 여러 칸으로 계산돼 엉뚱한 위치로 스크롤된다.
      const tl=timeline();
      const i=tl.findIndex(g=>g.label===d.calD);
      if(i>=0 && i < tl.length-CHART_N-S.cOff) S.cOff = Math.max(0, tl.length-CHART_N-i);
    }
    return render();
  }
  if(d.calM){
    const [Y,M]=S.calYM.split('-').map(Number);
    const nd=new Date(Y, M-1+Number(d.calM), 1);
    S.calYM = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
    return render();
  }
  if(d.pg){const n=Number(d.pg); if(n>=1){S.page=n; render();} return;}
  if(d.atab){S.admTab=d.atab; return render();}
  if(d.sendtog){const id=Number(d.sendtog);
    rpMaterialize(); S.sendSel[id]=!S.sendSel[id]; saveReport(); return render();}
  if(d.freq){S.send.freq=d.freq; saveReport(); return render();}
  if(d.ch){S.channels[d.ch]=!S.channels[d.ch]; saveReport(); return render();}
  if(d.exD){S.ex.days=Number(d.exD); S.ex.text=null; return render();}
  if(d.dl){const t=S.ex.text!==null?S.ex.text:buildPrompt();
    download(`벤치마킹브리핑_${verLabel0().replace(/\./g,'')}.${d.dl}`,t,d.dl==='md'?'text/markdown':'text/plain'); return;}
  if(d.rmRc){S.recipients.splice(Number(d.rmRc),1); saveReport(); return render();}
  if(d.cgOc){S.cg.oc=d.cgOc; S.cg.step=1; return render();}
  if(d.cgEv){S.cg.ev=d.cgEv; S.cg.step=2; return render();}
  if(d.cgLv){S.cg.lever=d.cgLv; S.cg.step=3; return render();}
  if(d.cgPlan){S.cg.plan=d.cgPlan; S.cg.step=4; return render();}

  switch(el.id){
    case 'selAll': S.sendSel={}; TASKS.forEach(t=>S.sendSel[t.id]=true); saveReport(); return render();
    case 'selNone': S.sendSel={}; saveReport(); return render();
    case 'fxCopy':{
      const t=curTask();
      try{ const r=navigator.clipboard.writeText(fxText(t)); if(r&&r.catch) r.catch(()=>{}); }catch(err){}
      S.fxCopied=true; render(); setTimeout(()=>{S.fxCopied=false; render();},1400); return;
    }
    case 'fxAskBtn':
      S.fxAsk = (S.fxAsk===curTask().id) ? null : curTask().id;
      S.fxDraft = null; S.fxAskText=''; return render();
    case 'fxAskX': S.fxAsk=null; S.fxAskText=''; return render();
    case 'fxAskGo': return runFxPrompt((document.getElementById('fxAskI')||{}).value);
    case 'fxEditBtn':
      S.fxDraft = (S.fxDraft===curTask().id) ? null : curTask().id;
      return render();
    case 'fxSave':{
      const t=curTask(); const box=document.getElementById('fxInput');
      const txt=(box?box.value:'').trim();
      if(txt){
        S.fx[t.id]={text:txt, at:stampNow()};
        S.sysOff[t.id]=true;                 // 시스템 제안 자동 꺼짐
        saveFormula(t).then(render);         // 서버가 정한 저장 시각으로 표시를 맞춘다
      }
      S.fxDraft=null; return render();
    }
    case 'fxCancel': S.fxDraft=null; return render();
    case 'fxRestore':{
      const box=document.getElementById('fxInput');
      if(box) box.value = LOGIC[curTask().lever].text;
      return;
    }
    case 'sysTog':{
      const t=curTask();
      if(sysOn(t)){                          // ON → OFF : 사용자 수식 모드
        S.sysOff[t.id]=true;
        if(!S.fx[t.id]) S.fx[t.id]={text:LOGIC[t.lever].text, at:stampNow()};
      } else {                               // OFF → ON : 초기 상태 복귀
        delete S.sysOff[t.id];
        S.fxDraft=null;
      }
      saveFormula(t).then(render);
      return render();
    }
    case 'calBtn':
      S.calOpen=!S.calOpen;
      if(S.calOpen) S.calYM = ((S.ver==='전체'?verLabel0():S.ver)||S.trTo).slice(0,7).replace('.','-');
      return render();
    case 'regen': return regenerate();
    case 'csv': return exportCsv();
    case 'cgReset': S.cg={step:0,oc:null,ev:null,lever:null,plan:null,name:'',sum:'',err:'',dupId:null,saving:false,phase:'',done:false}; return render();
    case 'cgGo': return createCustom();
    case 'cgFreeGo':{const v=(document.getElementById('cgFree')||{}).value;
      if(v&&v.trim()){S.cg.plan=v.trim(); S.cg.step=4; render();} return;}
    case 'exEdit':
      if(S.ex.editing){S.ex.text=document.getElementById('exText').value;}
      else{S.ex.text=S.ex.text!==null?S.ex.text:buildPrompt();}
      S.ex.editing=!S.ex.editing; return render();
    case 'exReset': S.ex.text=null; S.ex.editing=false; return render();
    case 'exCopy':{const t=S.ex.editing?document.getElementById('exText').value:(S.ex.text!==null?S.ex.text:buildPrompt());
      try{const r=navigator.clipboard.writeText(t); if(r&&r.catch) r.catch(()=>{});}catch(err){}
      S.ex.copied=true; render(); setTimeout(()=>{S.ex.copied=false; render();},1600); return;}
    case 'instrSave': return saveInstruction();
    case 'instrReset': return resetInstruction();
    case 'rcAdd':{const v=(document.getElementById('rcInput')||{}).value;
      if(v&&v.trim()){S.recipients.push(v.trim()); saveReport(); render();} return;}
    case 'fileBtn': document.getElementById('fileIn').click(); return;
    case 'rpSave':{const o=el.textContent; el.disabled=true; el.textContent='저장 중…';
      saveReport().then(ok=>{ el.textContent = ok===false?'저장 실패':'저장됨';
        setTimeout(()=>{el.disabled=false; el.textContent=o;},1400); }); return;}
    case 'rpTest':{const o=el.textContent; el.disabled=true; el.textContent='발송 중…';
      api('/api/report/test',{method:'POST'})
        .then(d=>{ el.textContent = d.sentAt ? `발송됨 ${d.sentAt}` : '발송됨'; })
        .catch(e=>{ el.textContent='발송 실패'; apiWarn(e); })
        .then(()=>setTimeout(()=>{el.disabled=false; el.textContent=o;},1800)); return;}
  }
});

  if(el.dataset && el.dataset.fbt){
    const id=el.dataset.fbt;
    S.fb[id]=S.fb[id]||{s:0,t:''}; S.fb[id].t=el.value;
    clearTimeout(memoTimers[id]);
    memoTimers[id]=setTimeout(()=>saveFeedback(id,{memo:S.fb[id].t}), 500);
    return;
  }
  if(el.dataset && el.dataset.f){
    const t=curTask();
    S.fields[t.id]=S.fields[t.id]||{};
    S.fields[t.id][el.dataset.f]=el.value;
    const box=document.querySelector('.result .stack');
    if(box) box.innerHTML=resultInner(t);
    saveFields(t.id);                     // 타이핑마다 보내지 않도록 500ms 디바운스
    return;
  }
  if(el.id==='q'){S.q=el.value; S.page=1;
    if(e.isComposing) return;      // 한글 조합 중엔 렌더 스킵 (compositionend 에서 갱신)
    const p=el.selectionStart; render();
    const n=document.getElementById('q'); if(n){n.focus(); n.setSelectionRange(p,p);} return;}
  if(el.id==='rpSearch'){S.rpQ=el.value;
    if(e.isComposing) return;                        // 한글 조합 중 렌더 스킵
    const p=el.selectionStart; render();
    const n=document.getElementById('rpSearch'); if(n){n.focus(); n.setSelectionRange(p,p);} return;}
  if(el.id==='instr'){S.instruction=el.value; S.instrSaved=false;
    const n=document.querySelector('.card-h .note'); if(n) n.textContent='저장되지 않은 변경'; return;}
  if(el.id==='exResearch'){
    S.ex.research=el.value; S.ex.text=null;
    if(!S.ex.editing){                              // 미리보기(.pp)만 부분 갱신 — textarea 재생성 안 함(한글 조합·포커스 유지)
      const t=buildPrompt();
      const pp=document.querySelector('.pp'); if(pp) pp.innerHTML=promptHtml(t);
      const note=document.querySelector('.grid-a .card .card-h .note');
      if(note) note.textContent=`${t.length.toLocaleString()}자 · 약 ${Math.round(t.length/1.6).toLocaleString()} 토큰`;
    }
    return;
  }
  // 프롬프트 편집 textarea — "편집 완료"를 누르기 전에 다른 화면으로 이동해도
  // 입력한 내용이 사라지지 않도록(같은 세션 안에서는) 타이핑마다 바로 상태에 반영한다.
  // 새로고침 시에는 저장 개념이 없는 필드라 자동으로 기본값으로 되돌아간다.
  if(el.id==='exText'){S.ex.text=el.value; return;}
});

/* ══════════════ 백엔드 연결 ══════════════
   화면 로직·마크업은 그대로 두고, 데이터 출처와 저장 경로만 API 로 연결한다.
   화면 데이터는 GET /api/bootstrap 한 번으로 전부 받는다. */
const JOB_POLL_MS = 2000;      // job 폴링 간격
const JOB_MAX_MS  = 600000;    // 클라이언트 상한 10분 (서버 job 은 15분에 자동 실패)
const oiTok = () => localStorage.getItem('oi-token') || '';

async function api(path, opt){
  opt = opt || {};
  const headers = {Authorization:'Bearer '+oiTok()};
  let body;
  if(opt.form){ body=opt.form; }              // FormData 는 Content-Type 을 두지 않는다(브라우저가 boundary 를 붙인다)
  else if(opt.body !== undefined){ headers['Content-Type']='application/json'; body=JSON.stringify(opt.body); }
  const res = await fetch(path, {method:opt.method||'GET', headers, body});
  if(res.status===401){                       // 토큰 만료 → 로그인으로
    localStorage.removeItem('oi-token'); location.replace('/login');
    throw new Error('세션이 만료되었습니다.');
  }
  const data = await res.json().catch(()=>({}));
  /* detail 은 서버 계약상 문자열이다. 혹시 객체가 오면 '[object Object]' 대신 상태코드를
     보여주고, 부가 키(code·id·name)는 err.data 로 호출부에 넘긴다. */
  if(!res.ok){
    const err = new Error(typeof data.detail==='string' ? data.detail : ('요청 실패 ('+res.status+')'));
    err.data = data; err.status = res.status; throw err;
  }
  return data;
}
/* 화면은 이미 갱신된 뒤라 저장 실패는 콘솔 경고로만 남긴다 */
function apiWarn(e){ console.warn('[O/I Spark] 저장 실패:', e && e.message); }

/* ── 사용자 입력 저장 ── */
/* 점수와 피드백은 따로 보낸다 — 서버는 넘어온 항목만 갱신하므로
   별점 저장이 아직 타이핑 중인 피드백을 덮어쓰지 않는다. */
function saveFeedback(id, patch){
  return api('/api/proposals/'+id+'/feedback', {method:'PUT', body:patch}).catch(apiWarn);
}
const memoTimers = {};
const fieldTimers = {};
function saveFields(id){                       // 타이핑 중 매번 보내지 않도록 디바운스
  clearTimeout(fieldTimers[id]);
  fieldTimers[id] = setTimeout(()=>{
    api('/api/proposals/'+id+'/fields', {method:'PUT', body:{fields:S.fields[id]||{}}}).catch(apiWarn);
  }, 500);
}
function saveFormula(t){
  const off = S.sysOff[t.id]===true;
  return api('/api/proposals/'+t.id+'/formula',
      {method:'PUT', body:{sysOff:off, text:off ? ((S.fx[t.id]||{}).text || null) : null}})
    .then(d=>{ if(off && S.fx[t.id] && d.at) S.fx[t.id].at = d.at; })   // 저장 시각은 서버가 정한다
    .catch(apiWarn);
}
function saveReport(){
  return api('/api/report/settings', {method:'PUT', body:{
    freq:S.send.freq, time:S.send.time, channels:S.channels,
    recipients:S.recipients, sendOff:TASKS.filter(t=>!rpIncluded(t)).map(t=>t.id),
  }}).then(()=>true).catch(e=>{ apiWarn(e); return false; });
}
/* 생성 인스트럭션 — DB app_setting 이 유일한 저장소다(발굴 LLM 이 읽는 곳). */
async function saveInstruction(){
  const box = document.getElementById('instr');
  if(box) S.instruction = box.value;
  try{
    await api('/api/admin/instruction', {method:'PUT', body:{text:S.instruction}});
    S.instrSaved = true;
  }catch(e){ apiWarn(e); alert('인스트럭션 저장에 실패했습니다. '+e.message); }
  render();
}
async function resetInstruction(){
  try{
    const d = await api('/api/admin/instruction/reset', {method:'POST'});
    DEFAULT_INSTRUCTION = d.text || '';
    S.instruction = DEFAULT_INSTRUCTION;
    S.instrSaved = true;
  }catch(e){ apiWarn(e); alert('초기값 복원에 실패했습니다. '+e.message); }
  render();
}
/* 내부 자료 업로드 — 본문까지 서버가 추출한다. '바로 사용'(use_now)이 RAG 게이트 통과 스위치다. */
async function uploadFiles(files, oc, useNow){
  if(!files.length) return;
  S.upErr=''; S.upMsg='업로드 중…'; render();
  const done=[];
  for(const f of files){
    const fd = new FormData();
    fd.append('file', f); fd.append('aff', oc); fd.append('use_now', useNow ? 'true' : 'false');
    try{
      const d = await api('/api/admin/uploads/file', {method:'POST', form:fd});
      if(d.upload) UPLOADS.unshift(d.upload);
      done.push(`${f.name} · ${d.st||''}${d.chars?` · 본문 ${d.chars.toLocaleString()}자`:''}`);
    }catch(e){ S.upErr = `${f.name} 업로드 실패 — ${e.message}`; }
  }
  S.upMsg = done.length ? done.join(' / ') : '';
  render();
}

/* ── 서버 응답을 화면 데이터에 넣기 ──
   다른 코드가 이미 잡고 있는 참조를 끊지 않도록 제자리에서 교체한다. */
function fill(target, src){
  if(Array.isArray(target)){ target.length=0; (src||[]).forEach(v=>target.push(v)); }
  else { Object.keys(target).forEach(k=>delete target[k]); Object.assign(target, src||{}); }
  return target;
}
function applyProposals(d){
  fill(VERSIONS, d.versions); fill(TASKS, d.tasks);
  // 목록에서 빠진 근거는 참조하지 않는다 — 렌더가 EV[k] 를 그대로 읽는다
  TASKS.forEach(t => { t.ev = (t.ev||[]).filter(k=>EV[k]); });
  if(!TASKS.some(t=>t.id===S.curId) && TASKS.length) S.curId = TASKS[0].id;
}
function applyBootstrap(d){
  // 사이드바에 표시할 계정은 **토큰 주인**이다. localStorage['oi-user'] 는 로그인 시점에
  // 한 번 심기는 값이라 다른 탭의 oiClear()·탈퇴로 토큰과 어긋날 수 있고, 그러면 화면에
  // 보이는 계정과 실제로 저장되는 계정이 갈라진다. 서버 응답을 진실의 원천으로 삼는다.
  S.userEmail = (d.user && d.user.email) || '';
  if(S.userEmail) localStorage.setItem('oi-user', S.userEmail);

  fill(OCS, d.ocs); fill(OC_COLOR, d.ocColor); fill(BIZ_C, d.bizColor);
  fill(OC, {}); OCS.forEach(o => OC[o.code] = o);

  // 관리지표·산출식·입력항목은 서버에서, 계산 함수는 화면에서 (LEVER_CALC)
  fill(LOGIC, {});
  Object.keys(d.levers || {}).forEach(k=>{
    const c = LEVER_CALC[k] || NO_CALC;
    LOGIC[k] = {metric:d.levers[k].metric, text:d.levers[k].text,
                fields:d.levers[k].fields || [], calc:c.calc, show:c.show};
  });
  fill(LEVERS, Object.keys(LOGIC));

  fill(EV, d.evidence); fill(EV_BIZ_FB, d.evBizFallback); fill(EV_NEW, d.evNew);
  fill(EV_OC, d.evOc); fill(EV_KW, d.evKw); fill(EV_BRIEF, d.evBrief); fill(KW_TREND, d.kwTrend);
  fill(KIND_MAP, d.kindMap);
  fill(SOURCES, d.sources); fill(UPLOADS, d.uploads);
  CRAWL_AT = d.crawlAt || '';
  DEFAULT_INSTRUCTION = d.instruction || '';

  fill(TR_KINDS, ['전체'].concat(d.kinds || []));
  fill(TR_BIZS,  ['전체'].concat(Object.keys(d.bizColor || {})));
  if(d.today) TR_TODAY = new Date(d.today+'T00:00:00');

  applyProposals(d);

  // 로그인 계정별 작업 상태 (평가·기준값·수식·발송 설정)
  const st = d.state || {};
  S.fb = st.fb || {}; S.fields = st.fields || {}; S.fx = st.fx || {};
  S.sysOff = st.sysOff || {}; S.sendOff = st.sendOff || {};
  S.send = st.send || S.send; S.recipients = st.recipients || [];
  S.channels = st.channels || S.channels;
  S.instruction = d.instruction || ''; S.instrSaved = true;

  // 기간·달력 기본값을 서버 기준일에 맞춘다
  S.trTo = trIso(TR_TODAY);
  S.trFrom = trIso(trShift(TR_TODAY, 30));
  S.calYM = VERSIONS.length ? VERSIONS[0].label.slice(0,7).replace('.','-') : S.trTo.slice(0,7);
  S.trGenAt = srcLast();
}

async function boot(){
  document.getElementById('main').innerHTML =
    `<div class="card" style="margin:48px auto;max-width:540px"><div class="card-b">
       <h2 style="margin-bottom:8px">데이터를 불러오는 중…</h2>
     </div></div>`;
  try{
    applyBootstrap(await api('/api/bootstrap'));
  }catch(e){
    document.getElementById('main').innerHTML =
      `<div class="card" style="margin:48px auto;max-width:540px"><div class="card-b">
         <h2 style="margin-bottom:8px">데이터를 불러오지 못했습니다</h2>
         <p class="note">${esc(e.message)}</p>
         <p class="note" style="margin-top:10px">백엔드가 떠 있는지 확인하세요.
            개발 환경은 <code>uvicorn app.main:app --reload</code> (기본 8000 포트)입니다.</p>
       </div></div>`;
    return;
  }
  render();
  loadQuotes();          // 티커는 화면이 뜬 뒤에 채운다 — 외부 시세 API 를 기다리지 않는다
}

/* 시세는 화면의 곁가지다. 실패하면 티커만 숫자 없이 남고 나머지 화면은 그대로다.
   bootstrap 과 달리 await 로 묶지 않는 이유가 그것이다. */
async function loadQuotes(){
  try{
    QUOTES = await api('/api/quotes');
  }catch(e){
    console.warn('[O/I Spark] 시세를 불러오지 못했습니다:', e && e.message);
    return;
  }
  if(S.screen==='list') render();   // 티커가 있는 화면은 과제 제안 하나뿐이다
}

history.replaceState({screen:S.screen, curId:S.curId}, '', '#'+S.screen);
boot();

/* ===== 테마 토글 (해/달 스위치) — 체크=다크(밤) ===== */
(function(){
  var chk = document.getElementById('themeChk');
  if(!chk) return;
  chk.checked = document.documentElement.getAttribute('data-theme') !== 'light';

    // 도넛 등 렌더 시점에 테마색이 정해지는 요소를 다시 칠한다 (부트 완료 후에만)
    try{ if(S && S.userEmail && typeof render==='function') render(); }catch(e){}

<!-- 계정 관리 (로그아웃 / 탈퇴 / 비밀번호 변경) -->
<script>
function oiToken(){ return localStorage.getItem('oi-token') || ''; }
function oiClear(){ localStorage.removeItem('oi-token'); localStorage.removeItem('oi-user'); }
function oiLogout(){ oiClear(); location.href = '/login'; }
async function oiWithdraw(){
  if(!confirm('정말 탈퇴하시겠습니까?\n계정이 삭제되며 다시 로그인할 수 없습니다.')) return;
  try{
    const r = await fetch('/api/auth/me', { method:'DELETE', headers:{ Authorization:'Bearer '+oiToken() } });
    if(!r.ok) throw 0;
  }catch(e){ alert('탈퇴 처리 중 오류가 발생했습니다.'); return; }
  oiClear(); alert('탈퇴가 완료되었습니다.'); location.href = '/login';
}
function oiChangePw(){ document.getElementById('pwErr').textContent=''; document.getElementById('pwModal').style.display='flex'; document.getElementById('pwCur').focus(); }
function oiClosePw(){ document.getElementById('pwModal').style.display='none'; ['pwCur','pwNew','pwNew2'].forEach(id=>document.getElementById(id).value=''); }
async function oiSavePw(){
  const cur=document.getElementById('pwCur').value, n1=document.getElementById('pwNew').value, n2=document.getElementById('pwNew2').value;
  const err=document.getElementById('pwErr');
  if(n1.length<4){ err.textContent='새 비밀번호는 4자 이상이어야 합니다.'; return; }
  if(n1!==n2){ err.textContent='새 비밀번호가 일치하지 않습니다.'; return; }
  try{
    const r=await fetch('/api/auth/change-password',{ method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+oiToken()}, body:JSON.stringify({current_password:cur, new_password:n1}) });
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ err.textContent=d.detail||'변경에 실패했습니다.'; return; }
    oiClosePw(); alert('비밀번호가 변경되었습니다.');
  }catch(e){ err.textContent='서버 연결 오류.'; }
}
document.getElementById('pwModal').addEventListener('click', e=>{ if(e.target.id==='pwModal') oiClosePw(); });
</script>
